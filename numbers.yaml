  # ------------------------------------------------------------------ sremu code (read at build time)
  # Constants and defaults of the committed sremu code, read from the installed (final build:
  # the pinned) sremu by tools/resolve_code_numbers.py. Never typed here (DESIGN 1.6 rule 7).
  - macro: numPageTargetMs
    kind: number
    description: Default page duration target (scenario numerics.page_target_s)
    unit: ms
    source: {type: code, id: sremu.timebase, expr: "float(Fraction(DEFAULT_PAGE_TARGET_S) * 1000)"}
    max_chars: 4
  - macro: numPageMin
    kind: number
    description: Smallest page size, samples
    source: {type: code, id: sremu.timebase, expr: "PAGE_MIN"}
    max_chars: 3
  - macro: numPageMax
    kind: number
    description: Largest page size, samples
    source: {type: code, id: sremu.timebase, expr: "PAGE_MAX"}
    max_chars: 6
  - macro: numStallTimeoutS
    kind: number
    description: Default stall timeout of lockstep runs (wall clock)
    unit: s
    source: {type: code, id: sremu.engine.emulator, expr: "EngineConfig.__dataclass_fields__['stall_timeout_s'].default"}
    max_chars: 3
  - macro: numPacedLagMs
    kind: number
    description: Default TX input slack D_lag of paced mode
    unit: ms
    source: {type: code, id: sremu.engine.emulator, expr: "float(EngineConfig.__dataclass_fields__['d_lag_s'].default * 1000)"}
    max_chars: 3
  - macro: numPacedSlacksMs
    kind: text
    description: Default deadline slacks at which paced mode counts misses
    unit: ms
    source: {type: code, id: sremu.engine.emulator, expr: "[float(s * 1000) for s in EngineConfig.__dataclass_fields__['slacks_s'].default]"}
    max_chars: 12
