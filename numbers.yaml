    description: "Smallest element count of B2"
    source: {type: benchmark, id: "B2"}
    max_chars: 4
  - macro: numBtwoNmax
    kind: number
    description: "Largest element count of B2"
    source: {type: benchmark, id: "B2"}
    max_chars: 8
  - macro: numBtwoNspreadPct
    kind: number
    description: "Spread (max/min - 1, rounded up) of the single-link F1 RTF over N at 1 MS/s"
    unit: "%"
    source: {type: benchmark, id: "B2"}
    max_chars: 3
  - macro: numBtwoFthreeRtfSmall
    kind: number
    description: "Single-link F3 RTF at the smallest N (1 MS/s, one surface)"
    source: {type: benchmark, id: "B2"}
    max_chars: 6
  - macro: numBtwoFthreeRtfLarge
    kind: number
    description: "Single-link F3 RTF at the largest N (1 MS/s, one surface)"
    source: {type: benchmark, id: "B2"}
    max_chars: 6
  - macro: numBtwoMaxLinks
    kind: number
    description: "Largest L with RTF >= 1, static F1, 1 MS/s, one surface, the same for every N (packed)"
    source: {type: benchmark, id: "B2"}
    max_chars: 3
  - macro: numBtwoLimTx
    kind: number
    description: "Transmitters of the benchmark scene with numBtwoMaxLinks links (L = n_tx n_rx)"
    source: {type: benchmark, id: "B2"}
    max_chars: 5
  - macro: numBtwoLimRx
