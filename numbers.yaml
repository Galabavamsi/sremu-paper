    description: "Logical CPUs per B2 slot"
    source: {type: benchmark, id: "B2"}
    max_chars: 4
  - macro: numBtwoBaseN
    kind: number
    description: "Element count of the B2 base point"
    source: {type: benchmark, id: "B2"}
    max_chars: 5
  - macro: numBtwoBaseMsps
    kind: number
    description: "Sample rate of the B2 base point"
    unit: MS/s
    source: {type: benchmark, id: "B2"}
    max_chars: 3
  - macro: numBtwoBaseRtf
    kind: number
