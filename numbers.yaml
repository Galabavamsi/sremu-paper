    unit: ms
    source: {type: code, id: sremu.engine.pacer, expr: "SPIN_NS / 1e6"}
    max_chars: 3
  - macro: numMetricsWindowMs
    kind: number
    description: Virtual-time window of the metrics log and of RTF_min
    unit: ms
    source: {type: code, id: sremu.metrics.rt, expr: "float(RTF_WINDOW_S * 1000)"}
    max_chars: 3
  - macro: txtControlEndpoint
    kind: text
    description: Default control (ROUTER) endpoint of a served emulator
    source: {type: code, id: sremu.contracts, expr: "DEFAULT_CONTROL_ENDPOINT"}
    max_chars: 22
  - macro: numFrameHeaderBytes
    kind: number
    description: Size of the native data-plane frame header
