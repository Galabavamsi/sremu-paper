    description: "PENDING (AWS): in-process send/recv call latency p99, 1000-sample buffers"
    unit: "us"
    source: {type: benchmark, id: "E-F-latency"}
    max_chars: 6
  - macro: numZmqRttPfiftyUs
    kind: number
    description: "PENDING (AWS): native-ZMQ two-process round trip p50"
    unit: "us"
    source: {type: benchmark, id: "E-F-latency"}
    max_chars: 6
  - macro: numApiThroughputMsps
    kind: number
    description: "PENDING (AWS): sustained API throughput"
    unit: "MS/s"
    source: {type: benchmark, id: "E-F-latency"}
    max_chars: 5

  # ------------------------------------------------------------------ case studies
  - macro: txtEBResult
    kind: text
    description: E-B headline phrase (RIS switches between packets; timed vs tick-based untimed semantics; lab-like SIM geometry)
    source: {type: experiment, id: "E-B"}
    max_chars: 84
  - macro: txtEAResult
