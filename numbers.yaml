# numbers.yaml -- every number or result phrase quoted in the paper text (DESIGN 1.6 rule 7).
#
# tools/build_paper.py renders generated/numbers.tex from this file. A macro whose value is
# not yet produced by the pipeline expands to \sremuPlaceholder{name}: a bold ?? in draft
# builds and a hard error in final builds. A fixed `value` is allowed ONLY for
# definitional constants (source type `definition`, e.g. the thresholds of DESIGN 12.1),
# dataset facts (`data`) and third-party numbers (`reported`, below), never for results.
#
# Fields
#   macro        LaTeX macro name, letters only (used as \macro{} in the text)
#   kind         number | text   (text = a short result phrase filled by the pipeline)
#   description  what the number is
#   unit         unit printed after the macro in the text, if any
#   source       {type: test|figure|study|benchmark|experiment|definition|data|code|reported,
#                 id: ...}
#   value        fixed value (definition/data/reported only)
#   max_chars    length budget used by tools/check_arxiv.py to bound the abstract length
#                while placeholders remain (default 8 for numbers, 80 for text)
#
# REPORTED-class numbers (data class REPORTED, DESIGN 1.6 and 11): a number quoted from a
# third-party source, never an sremu result. They use source type `reported` with
#   source: {type: reported, id: <bibkey>, cite: [<bibkey>, ...]}   and a fixed `value`.
# tools/check_claims.py requires every `cite` key to be in refs.bib and to be cited in each
# sentence (or table row) that uses the macro. `note` records a known weakness of the source
# link (tools/ ignore it).

macros:
  # ------------------------------------------------------------------ definitions / data
  - macro: numSustainMissRate
    kind: number
    description: Deadline-miss-rate threshold in the definition of "Sustainable" (DESIGN 12.1)
    source: {type: definition, id: "DESIGN-12.1-Sustainable"}
    value: "\\ensuremath{10^{-3}}"
    max_chars: 5
  - macro: numSustainSlackMs
    kind: number
    description: Slack used in the definition of "Sustainable"
    unit: ms
    source: {type: definition, id: "DESIGN-12.1-Sustainable"}
    value: "1"
    max_chars: 1
  - macro: numSustainMinDurationS
    kind: number
    description: Minimum paced-run duration in the definition of "Sustainable"
    unit: s
    source: {type: definition, id: "DESIGN-12.1-Sustainable"}
    value: "60"
    max_chars: 2
  - macro: numLabFreqGHz
    kind: number
    description: Carrier frequency of the digitized laboratory map (laboratory measurement collected by the authors, DIG)
    unit: GHz
    source: {type: data, id: "V-LAB-dataset"}
    value: "3.5"
    max_chars: 3

  # ------------------------------------------------------------------ REPORTED (Section II, third-party facts)
  - macro: txtRepSionnaRisAddedVersion
    kind: text
    description: Sionna version that added RIS (REPORTED)
    source: {type: reported, id: SionnaV018Release, cite: [SionnaV018Release]}
    value: "0.18"
    max_chars: 4
  - macro: txtRepSionnaRisRemovedVersion
    kind: text
    description: Sionna RT version that removed RIS (REPORTED)
    source: {type: reported, id: SionnaRTReleases, cite: [SionnaRTReleases]}
    value: "1.0"
    max_chars: 3
  - macro: txtRepSionnaLatestVersion
    kind: text
    description: Latest Sionna RT release checked for a RIS module (29 Sep 2026; REPORTED)
    source: {type: reported, id: SionnaRTReleases, cite: [SionnaRTReleases]}
    value: "2.2.0"
    max_chars: 5
  - macro: numRepGoSimRisMaxElements
    kind: number
    description: Largest number of RIS elements GoSimRIS supports (REPORTED)
    source: {type: reported, id: ElGhalbzouri2025GoSimRIS, cite: [ElGhalbzouri2025GoSimRIS]}
    value: "64"
    max_chars: 2
  - macro: numRepOrixLoopMinMs
    kind: number
    description: Shortest period of the ORIX near-RT control loop (REPORTED)
    unit: ms
    source: {type: reported, id: Kayraklik2026ORIX, cite: [Kayraklik2026ORIX]}
    value: "10"
    max_chars: 2
  - macro: numRepOrixLoopMaxS
    kind: number
    description: Longest period of the ORIX near-RT control loop (REPORTED)
    unit: s
    source: {type: reported, id: Kayraklik2026ORIX, cite: [Kayraklik2026ORIX]}
    value: "1"
    max_chars: 1
  - macro: numRepColosseumSdrs
    kind: number
    description: "Number of software-defined radios in Colosseum (REPORTED; the Bonati 2021 abstract names them together with a massive channel emulator core; it does not say that channels are emulated between all of them)"
    source: {type: reported, id: Bonati2021Colosseum, cite: [Bonati2021Colosseum]}
    note: "cite names the record checked for the number (Bonati 2021); Section II cites Polese2024ColosseumDT as well for the facility, Table I does not."
    value: "256"
    max_chars: 3
  - macro: numRepTraceRttMs
