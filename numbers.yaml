  - macro: numBoneRelRmsPct
    kind: number
    description: "Relative RMS error of the DESIGN 7.4 cost-model fit"
    unit: "%"
    source: {type: benchmark, id: "B1"}
    max_chars: 4
  - macro: numBoneRelMaxPct
    kind: number
