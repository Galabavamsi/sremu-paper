# numbers.yaml -- every number or result phrase quoted in the paper text (DESIGN 1.6 rule 7).
#
# tools/build_paper.py renders generated/numbers.tex from this file. A macro whose value is
# not yet produced by the pipeline expands to \sremuPlaceholder{name}: a bold ?? in draft
# builds and a hard error in final builds. A fixed `value` is allowed ONLY for
# definitional constants (source type `definition`, e.g. the thresholds of DESIGN 12.1),
# dataset facts (`data`) and third-party numbers (`reported`, below), never for results.
#
# Fields
#   macro        LaTeX macro name, letters only (used as \macro{} in the text)
#   kind         number | text   (text = a short result phrase filled by the pipeline)
#   description  what the number is
#   unit         unit printed after the macro in the text, if any
#   source       {type: test|figure|study|benchmark|experiment|definition|data|code|reported,
#                 id: ...}
#   value        fixed value (definition/data/reported only)
#   max_chars    length budget used by tools/check_arxiv.py to bound the abstract length
#                while placeholders remain (default 8 for numbers, 80 for text)
#
# REPORTED-class numbers (data class REPORTED, DESIGN 1.6 and 11): a number quoted from a
# third-party source, never an sremu result. They use source type `reported` with
#   source: {type: reported, id: <bibkey>, cite: [<bibkey>, ...]}   and a fixed `value`.
# tools/check_claims.py requires every `cite` key to be in refs.bib and to be cited in each
# sentence (or table row) that uses the macro. `note` records a known weakness of the source
# link (tools/ ignore it).

macros:
  # ------------------------------------------------------------------ definitions / data
  - macro: numSustainMissRate
    kind: number
    description: Deadline-miss-rate threshold in the definition of "Sustainable" (DESIGN 12.1)
    source: {type: definition, id: "DESIGN-12.1-Sustainable"}
    value: "\\ensuremath{10^{-3}}"
    max_chars: 5
  - macro: numSustainSlackMs
    kind: number
    description: Slack used in the definition of "Sustainable"
    unit: ms
    source: {type: definition, id: "DESIGN-12.1-Sustainable"}
    value: "1"
    max_chars: 1
  - macro: numSustainMinDurationS
    kind: number
    description: Minimum paced-run duration in the definition of "Sustainable"
    unit: s
    source: {type: definition, id: "DESIGN-12.1-Sustainable"}
    value: "60"
    max_chars: 2
  - macro: numBacklogSlackMs
    kind: number
    description: "Slack of the backlog rule of the served benchmark (bench/b4_control.py BACKLOG_MISS_5MS: a repetition is backlogged when its page latency p50 exceeds one page or more than numBacklogMissPct % of its pages miss this slack); also the second default slack of paced mode"
    unit: ms
    source: {type: definition, id: "bench-b4-backlog-rule"}
    value: "5"
    max_chars: 1
  - macro: numBacklogMissPct
    kind: number
    description: "Miss-rate threshold of the backlog rule at numBacklogSlackMs ms slack (bench/b4_control.py BACKLOG_MISS_5MS = 0.01)"
    unit: "%"
    source: {type: definition, id: "bench-b4-backlog-rule"}
    value: "1"
    max_chars: 1
  - macro: numLabFreqGHz
    kind: number
    description: Carrier frequency of the digitized laboratory map (laboratory measurement collected by the authors, DIG)
    unit: GHz
    source: {type: data, id: "V-LAB-dataset"}
    value: "3.5"
    max_chars: 3

  # ------------------------------------------------------------------ REPORTED (Section II, third-party facts)
  - macro: txtRepSionnaRisAddedVersion
    kind: text
    description: Sionna version that added RIS (REPORTED)
    source: {type: reported, id: SionnaV018Release, cite: [SionnaV018Release]}
    value: "0.18"
    max_chars: 4
  - macro: txtRepSionnaRisRemovedVersion
    kind: text
    description: Sionna RT version that removed RIS (REPORTED)
    source: {type: reported, id: SionnaRTReleases, cite: [SionnaRTReleases]}
    value: "1.0"
    max_chars: 3
  - macro: txtRepSionnaLatestVersion
    kind: text
    description: Latest Sionna RT release checked for a RIS module (29 Sep 2026; REPORTED)
    source: {type: reported, id: SionnaRTReleases, cite: [SionnaRTReleases]}
    value: "2.2.0"
    max_chars: 5
  - macro: numRepGoSimRisMaxElements
    kind: number
    description: Largest number of RIS elements GoSimRIS supports (REPORTED)
    source: {type: reported, id: ElGhalbzouri2025GoSimRIS, cite: [ElGhalbzouri2025GoSimRIS]}
    value: "64"
    max_chars: 2
  - macro: numRepOrixLoopMinMs
    kind: number
    description: Shortest period of the ORIX near-RT control loop (REPORTED)
    unit: ms
    source: {type: reported, id: Kayraklik2026ORIX, cite: [Kayraklik2026ORIX]}
    value: "10"
    max_chars: 2
  - macro: numRepOrixLoopMaxS
    kind: number
    description: Longest period of the ORIX near-RT control loop (REPORTED)
    unit: s
    source: {type: reported, id: Kayraklik2026ORIX, cite: [Kayraklik2026ORIX]}
    value: "1"
    max_chars: 1
  - macro: numRepColosseumSdrs
    kind: number
    description: "Number of software-defined radios in Colosseum (REPORTED; the Bonati 2021 abstract names them together with a massive channel emulator core; it does not say that channels are emulated between all of them)"
    source: {type: reported, id: Bonati2021Colosseum, cite: [Bonati2021Colosseum]}
    note: "cite names the record checked for the number (Bonati 2021); Section II cites Polese2024ColosseumDT as well for the facility, Table I does not."
    value: "256"
    max_chars: 3
  - macro: numRepTraceRttMs
    kind: number
    description: Control-plane round-trip time over UDP reported by TRACE (REPORTED)
    unit: ms
    source: {type: reported, id: Kumar2026TRACE, cite: [Kumar2026TRACE]}
    value: "5.2"
    max_chars: 3

  # ------------------------------------------------------------------ verification and validation
  - macro: numOracleCount
    kind: number
    description: Number of analytic oracle checks (PH/RT/IO ids, the CI tier; ST ids are statistical and counted separately) passing in the pinned junit
    source: {type: test, id: "junit:count(PH,RT,IO)"}
    max_chars: 3
  - macro: numTangCurveMaxDevDb
    kind: number
    description: Max |difference| between sremu and Tang et al.'s published model curves
    unit: dB
    source: {type: study, id: "V-TANG-1"}
    max_chars: 5
  - macro: numTangMeasBiasDb
    kind: number
    description: "Mean of measured minus emulator over the V-TANG points (digitized Tang chamber measurements minus sremu, dB; printed without sign: the text says the emulator lies below the measurements, and gen_results checks that every residual is positive). Accuracy framing by author decision D-12 (2026-10-11), reversing DESIGN 10.8"
    unit: dB
    source: {type: study, id: "V-TANG-2"}
    max_chars: 4
  - macro: numTangMeasSdDb
    kind: number
    description: Sample SD (ddof 1) of measured minus emulator
    unit: dB
    source: {type: study, id: "V-TANG-2"}
    max_chars: 4
  - macro: numTangMeasRmseDb
    kind: number
    description: RMSE of measured minus emulator over the V-TANG points
    unit: dB
    source: {type: study, id: "V-TANG-2"}
    max_chars: 4
  - macro: numTangMeasMaxDb
    kind: number
    description: Largest |measured minus emulator| over the V-TANG points
    unit: dB
    source: {type: study, id: "V-TANG-2"}
    max_chars: 4
  - macro: numTangPanelBiasMinDb
    kind: number
    description: Smallest per-geometry mean of measured minus emulator (four geometries of nine links)
    unit: dB
    source: {type: study, id: "V-TANG-2"}
    max_chars: 4
  - macro: numTangPanelBiasMaxDb
    kind: number
    description: Largest per-geometry mean of measured minus emulator
    unit: dB
    source: {type: study, id: "V-TANG-2"}
    max_chars: 4
  - macro: numTangMeasN
    kind: number
    description: Number of digitized measurement points used in V-TANG-2
    source: {type: study, id: "V-TANG-2"}
    max_chars: 2
  - macro: numTangFcGHz
    kind: number
    description: Carrier frequency of the Tang surface in V-TANG (read from the run's resolved scenario)
    unit: GHz
    source: {type: study, id: "V-TANG"}
    max_chars: 2
  - macro: numTangPubMeasBiasDb
    kind: number
    description: "Mean of measured minus Tang et al.'s published Eq. 9 curve over the V-TANG points (their own residual; exact decimal mean of the digitized values, half-even; printed without sign: the published model lies below every point, checked by gen_results)"
    unit: dB
    source: {type: study, id: "V-TANG-2"}
    max_chars: 4
  - macro: numTangGammaMag
    kind: number
    description: "Reflection amplitude of the coding state of Tang RIS1 used in V-TANG (REPORTED, Tang Table III; read from sremu data/validation/tang2022/tang2022_parameters.json)"
    source: {type: study, id: "V-TANG"}
    max_chars: 3
  - macro: numTangGammaLossDb
    kind: number
    description: "-20 log10 of that amplitude: the level it alone removes from the model (Appendix D, discussion of the constant offset)"
    unit: dB
    source: {type: study, id: "V-TANG"}
    max_chars: 4

  # ------------------------------------------------------------------ Section IV-C / Appendix C: cell-model sensitivity
  # Filled by tools/gen_results.py from paper/sweeps/results/sensitivity_cellmodel (point vs
  # po_patch at the lab pitch, coefficient level; script and meta.json in that directory) and
  # the V-LAB paired point-vs-patch record (sensitivity S-NF of the unblinded V-LAB run).
  - macro: numLabPitchMm
    kind: number
    description: "Cell pitch of the laboratory tiles (lab_arc.yaml, nominal)"
    unit: mm
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 4
  - macro: numLabPitchMarginMm
    kind: number
    description: "Half a wavelength at 3.5 GHz minus the lab pitch (the auto threshold margin)"
    unit: mm
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 4
  - macro: numLabPitchMarginPct
    kind: number
    description: "That margin relative to half a wavelength"
    unit: "%"
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 4
  - macro: numCellRetroAngleA
    kind: number
    description: "First retro-reflection angle at which the half-wavelength cell factor is quoted"
    unit: deg
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 2
  - macro: numCellRetroAngleB
    kind: number
    description: "Second retro-reflection angle at which the half-wavelength cell factor is quoted"
    unit: deg
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 2
  - macro: numCellRetroADb
    kind: number
    description: "po_patch minus point power of one far-field half-wavelength cell at the first retro angle (Richardson-converged patch)"
    unit: dB
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 5
  - macro: numCellRetroBDb
    kind: number
    description: "po_patch minus point power of one far-field half-wavelength cell at the second retro angle (refined start, Richardson-converged)"
    unit: dB
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 5
  - macro: numCellSensRisMinDb
    kind: number
    description: "Smallest decrease of the RIS power with po_patch forced (E-B RIS term of RX1 at its optimum, arc and lab-like, LOS blocked and present; E-C lab continuous optimum per receiver)"
    unit: dB
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 4
  - macro: numCellSensRisMaxDb
    kind: number
    description: "Largest such decrease"
    unit: dB
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 4
  - macro: numCellSensEcMaxDb
    kind: number
    description: "Largest change of an E-C laboratory-geometry loss (RIS term vs continuous phase; 1-bit, 2-bit, lab, ideal-designed rows) with po_patch forced (bound, rounded up)"
    unit: dB
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 4
  - macro: numCellSensSwitchMaxDb
    kind: number
    description: "Largest change of RX1's channel change at the E-B1 switch with po_patch forced (arc and lab-like, LOS blocked and present)"
    unit: dB
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 4
  - macro: numCellSensCfgPct
    kind: number
    description: "Largest share of cells in which the E-B exact optima for RX1 or RX2 differ between point and po_patch"
    unit: "%"
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 2
  - macro: numCellSensDeployLossDb
    kind: number
    description: "Largest loss of deploying the point optimum for RX1 when po_patch is the model (E-B, bound, rounded up)"
    unit: dB
    source: {type: study, id: "sensitivity_cellmodel"}
    max_chars: 4
  - macro: numLabCmMedianMaxDb
    kind: number
    description: "V-LAB: largest per-ring median of |M2(point) - M2(po_patch)| at the same geometry (paired, sensitivity S-NF)"
    unit: dB
    source: {type: study, id: "V-LAB"}
    max_chars: 4
  - macro: numLabCmQninetyfiveMaxDb
    kind: number
    description: "V-LAB: largest per-ring 95th percentile of |M2(point) - M2(po_patch)| (paired, sensitivity S-NF)"
    unit: dB
    source: {type: study, id: "V-LAB"}
    max_chars: 4
  - macro: txtVLabOutcome
    kind: text
    description: Verb phrase completing "a laboratory comparison under a pre-specified plan hash-locked before unblinding ..." (conclusion; C1-C3 outcome and power label)
    source: {type: study, id: "V-LAB"}
    max_chars: 72
  # ------------------------------------------------------------------ wall-clock behaviour
  - macro: txtPacedPlatform
    kind: text
    description: Platform of the paced-mode headline (Linux host and instance type)
    source: {type: benchmark, id: "B3"}
    max_chars: 30
  - macro: numPacedLinks
    kind: number
    description: Number of links sustained in paced mode on that platform
    source: {type: benchmark, id: "B3"}
    max_chars: 4
  - macro: numPacedMSps
    kind: number
    description: Per-stream sample rate of that paced configuration
    unit: MS/s
    source: {type: benchmark, id: "B3"}
    max_chars: 5

  # ------------------------------------------------------------------ Section VI (B1-B6)
  # Filled by tools/gen_results.py through tools/bench_results.py from
  # paper/sweeps/results/bench/{B1,B2,B3,B4,B6} (MEAS; provenance in each meta.json). F5
  # (native ZMQ) macros stay placeholders until F5 is rerun after the transport fix.
  # Code and data availability (BLOCKER-3): read by tools/gen_results.py from availability.yaml.
  # status conditional (current, H-2 open): the text prints no licence, URL or DOI and these
  # macros expand to \sremuUnreleased (no placeholder); status released: a PENDING field stays a
  # placeholder, so a final build refuses until it is filled.
  - macro: txtLicence
    kind: text
    description: "Code licence of sremu and of the paper artifact (availability.yaml; H-2)"
    source: {type: data, id: "availability.yaml"}
    max_chars: 20
  - macro: txtRepoUrl
    kind: text
    description: "Public URL of the sremu repository (availability.yaml; H-2, H-7)"
    source: {type: data, id: "availability.yaml"}
    max_chars: 60
  - macro: txtArchiveDoi
    kind: text
    description: "DOI of the archived release of the versions used (availability.yaml)"
    source: {type: data, id: "availability.yaml"}
    max_chars: 40
  - macro: txtDataDoi
    kind: text
    description: "DOI of the authors' own data files (availability.yaml; H-1 for the laboratory map)"
    source: {type: data, id: "availability.yaml"}
    max_chars: 40
  # Implementation facts (MINOR-11), read by tools/gen_results.py from the sremu checkout.
  - macro: txtPythonReq
    kind: text
    description: "Lowest Python version sremu supports (pyproject.toml requires-python)"
    source: {type: data, id: "sremu-pyproject"}
    max_chars: 5
  - macro: numSrcKloc
    kind: number
    description: "Thousands of lines of Python in src/sremu (all lines, rounded)"
    source: {type: data, id: "sremu-source-tree"}
    max_chars: 3
  - macro: numSrcModules
    kind: number
    description: "Python modules in src/sremu"
    source: {type: data, id: "sremu-source-tree"}
    max_chars: 3
  - macro: numSustainWarmupS
    kind: number
    description: Warm-up before the measured window in the definition of "Sustainable"
    unit: s
    source: {type: definition, id: "DESIGN-12.1-Sustainable"}
    value: "5"
    max_chars: 1
  - macro: numBtwoFfiveRtf
    kind: number
    description: "B2-F45 (bf08268): end-to-end RTF of the B2 base point (1 link, N = 240, one surface, 1 MS/s) served over the native ZMQ data plane to a TX and an RX client process (F5): virtual time delivered to the RX client over the wall time from the served engine's warm-up boundary to the client's last sample"
    source: {type: benchmark, id: "B2-F5-rerun"}
    max_chars: 5
  - macro: txtHostServer
    kind: text
    description: "AWS instance type of the lockstep benchmarks B1, B2 and B2-F45 (B2-F45 on another instance of the type) and of the E-F latency measurement"
    source: {type: benchmark, id: "B2"}
    max_chars: 18
  - macro: numBtwoPlanned
    kind: number
    description: "B2 points planned (server plan)"
    source: {type: benchmark, id: "B2"}
    max_chars: 5
  - macro: numBtwoRun
    kind: number
    description: "B2 points run (the rest dropped by series pruning)"
    source: {type: benchmark, id: "B2"}
    max_chars: 5
  - macro: numBtwoPruned
