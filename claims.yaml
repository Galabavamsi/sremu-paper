# claims.yaml -- every capability or result claim in the paper, mapped to its evidence
# (DESIGN 1.6 and 13.6, minimal version). tools/check_claims.py enforces it.
#
# Fields
#   text      the claim in one sentence (what the paper asserts)
#   where     files that state it (a \claim{ID} marker there is optional)
#   evidence  list of  test:<spec id>   passes in the pinned junit (PH, RT, IO, ST, G, W, VA, V-*)
#                      pytest:<tests/...py>[::<test>]
#                                       sremu tests without a spec id (e.g. RisEnv); passes in the
#                                       pinned junit; the file must exist in the sremu checkout
#                      fig:<F1..F12>    figure registered and generated (meta + PDF present)
#                      cite:<bib key>   entry exists in refs.bib
#                      table:<label>    LaTeX label exists (e.g. tab:tools)
#                      spec:<section>   design-spec reference (informational, always satisfied)
#   gates     human gates (human_gates.yaml) that must be closed
#   banned_word_uses
#             optional list of {word, context}: allows a banned word (DESIGN 1.6 rule 5) or an
#             unqualified "real-time" in the text unit containing `context`, under this claim
#
# A claim is "supported" when every test passes, every figure exists and every gate is
# closed; otherwise it is "pending". Draft builds report pending claims; final builds refuse.
#
# Sections III, IV, VIII-X and the appendix (WP12, stage C) describe sremu commit 2a016a6;
# each capability claim there names the tests that exercise it. Module paths are in the TeX
# comments next to the claims. Sections V and VII (WP12 stage C draft) describe the committed
# study and experiment results; their numbers come from tools/gen_results.py.
# DESIGN D24 (fresh-attempt framing): no claim compares sremu with an earlier simulator; the
# single transparency sentence is C-LINEAGE.

claims:
  # ================================================================ abstract, I, II
  C-GAP:
    text: "As of 10 Oct 2026, no surveyed open tool combines (i) IQ-level multi-node emulation behind an SDR-style interface, (ii) runtime external RIS commands applied at an explicit logged sample, (iii) imported measured per-state responses, and (iv) characterized wall-clock behaviour."
    where: [sections/01_introduction.tex, sections/02_related_work.tex]
    evidence:
      - table:tab:tools
      - cite:Gurses2026ACHEM
      - cite:ElGhalbzouri2025GoSimRIS
      - cite:Kayraklik2026ORIX
      - cite:Burtakov2023QRIS
      - cite:Tsampazi2025RISColosseum
      - cite:OAIrfsim
      - cite:srsRANZMQ
      - cite:SionnaRTReleases
      - test:RT-05
      - test:IO-02
      - test:IO-03
      - test:PH-31
      - fig:F7
      - fig:F8
    gates: []
  C-OPEN:
    text: "sremu is open source (title: 'An Open ... Emulator'; abstract: 'open-source')."
    where: [main.tex, sections/abstract.tex]
    evidence: [spec:DESIGN-2.1]
    gates: [H-2]
  C-SOFTWARE-ONLY:
    text: "sremu is software-only: it needs no radio hardware; external applications exchange samples with it over sockets or in process (DESIGN 1.1)."
    where: [sections/abstract.tex, sections/01_introduction.tex, sections/10_conclusion.tex]
    evidence: [test:IO-02, test:IO-07, spec:DESIGN-1.1]
    gates: []
    banned_word_uses:
      - {word: only, context: "software-only emulator"}
  C-MODELCARD:
    text: "Table II (generated from sremu docs/model_card.yaml): model, validity domain, evidence and default per component, including 'statistical background only' for diffuse fading and 'coupling via tables only'."
    where: [generated/tables/table2_model_card.tex, sections/04_physical_model.tex]
    evidence: [test:PH-01, test:PH-02, test:PH-04, test:PH-26, test:PH-28, test:PH-31, test:PH-10, test:PH-32, test:PH-08, test:PH-11, test:ST-02, test:G6, test:PH-17, test:PH-18, test:PH-19, test:PH-20, test:PH-21, test:G5, test:PH-13, test:PH-15, test:RT-12, table:tab:modelcard]
    gates: []
    banned_word_uses:
      - {word: only, context: "Statistical background only"}
      - {word: only, context: "coupling via tables only"}
  C-TIMED-CMD:
    text: "A RIS command for switch time t_sw takes effect on receiver r (render tile j) at k = to_ticks(t_sw + tau_{r,j}(t_sw), f_r), with tau evaluated in the geometry at t_sw; requested and applied samples are logged."
    where: [sections/01_introduction.tex, sections/abstract.tex, sections/03_design.tex, sections/10_conclusion.tex]
    evidence: [test:RT-05, test:RT-06, test:RT-07, test:IO-03, fig:F2]
    gates: []
  C-LOCKSTEP-EXACT:
    text: "Lockstep runs are sample-exact and deterministic, including with controllers in the loop; RX samples are bitwise identical under client chunking, event/barrier cuts and across process boundaries."
    where: [sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [test:RT-03, test:RT-08, test:RT-16, test:IO-02]
    gates: []
  C-CONTRIB-1:
    text: "Timed RIS control in an IQ-level emulator: per-receiver application, one physical switch time for late commands, command log, deterministic barriers, measured paced mode, UHD-shaped API, framed ZMQ data plane, GS RIS 008-aligned table schema."
    where: [sections/01_introduction.tex]
    evidence: [test:RT-05, test:RT-06, test:RT-08, test:RT-18, test:IO-02, test:IO-03, test:IO-05, fig:F1, fig:F2, cite:ETSI_GS_RIS008]
    gates: []
  C-CONTRIB-2:
    text: "A verified physical model with a stated validity domain: area-tied kernel equal to three published forms, model card, CI oracle count, MATLAB code-to-code, Tang curves, pre-registered consistency check against a laboratory measurement collected by the authors (null result and measurement-design lesson), CFO and BER checks against the CRB and theory."
    where: [sections/01_introduction.tex, sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [test:PH-02, test:PH-04, test:PH-26, test:G1, test:G2, test:G3, test:V-TANG-1, test:V-LAB, test:V-CFO-1, test:ST-04, test:ST-05, fig:F3, fig:F4, fig:F5]
    gates: [H-6]
  C-CONTRIB-3:
    text: "Characterized wall-clock behaviour: definitions, RTF, deadline misses, latency percentiles, scaling, cost-model fit on a laptop and a Linux server."
    where: [sections/01_introduction.tex, sections/abstract.tex]
    evidence: [test:RT-18, fig:F7, fig:F8]
    gates: [H-5]
  C-CONTRIB-4:
    text: "Case studies of timed control: intra-frame reconfiguration timing (E-B, the study that requires the sample level), signaling-delay time scale in a blocked corridor (E-A, batch path with an IQ consistency subset), non-ideality ablation (E-C), FM dimensioning (E-D)."
    where: [sections/01_introduction.tex, sections/abstract.tex]
    evidence: [test:VA-5, test:VA-1, fig:F9, fig:F10, fig:F11, fig:F12]
    gates: [H-6]
  C-SCOPE:
    text: "Scope box: not a UHD drop-in, not hard real time, not a ray tracer, no mutual-coupling physics (tables only), scalar co-polar, single-bounce RIS paths, order-1 walls; paced timing measured per platform."
    where: [sections/01_introduction.tex]
    evidence: [spec:DESIGN-1.5, cite:ETSI_GR_RIS003_v121]
    gates: []
  C-LINEAGE:
    text: "An earlier in-house simulator by the authors was used in [Mishra & Kherani WCL 2025, NCC 2025]; sremu is an independent new implementation. (DESIGN D24: the single allowed transparency sentence; no comparison with that simulator is made anywhere in the paper.)"
    where: [sections/02_related_work.tex]
    evidence: [cite:Mishra2025WCL, cite:Mishra2025NCC, spec:DESIGN-D24]
    gates: []
  C-TRACE:
    text: "TRACE paragraph and Table I row (DESIGN 1.2 wording)."
    where: [sections/02_related_work.tex, sections/tables/table1_tools.tex]
    evidence: [cite:Kumar2026TRACE]
    gates: [H-4]
  C-ABS-TANG:
    text: "The kernel reproduces published RIS path-loss model curves within \\numTangCurveMaxDevDb dB."
    where: [sections/abstract.tex]
    evidence: [test:V-TANG-1, fig:F3, cite:Tang2022mmWave]
    gates: []
  C-ABS-LAB:
    text: "Pre-registered comparison with a digitized 3.5 GHz laboratory measurement collected by the authors (outcome phrase from the protocol's decision rules and power label: underpowered, null result)."
    where: [sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [test:V-LAB, fig:F4, spec:DESIGN-10.9]
    gates: [H-6]
    banned_word_uses:
      - {word: only, context: "from LOS-only"}
  C-ABS-PACED:
    text: "Wall-clock-paced runs on the named platform sustain N links at Y MS/s with a deadline-miss rate below 1e-3 (Sustainable, DESIGN 12.1)."
    where: [sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [fig:F8, spec:DESIGN-12.1]
    gates: [H-5]
  C-ABS-EB:
    text: "E-B headline for the 0.5 ms guard slice, which the abstract and the conclusion name (geometry modelled on the lab arrangement, SIM nominal geometry; AWS run, sweeps/results/E-B-arc): timed commands whose lead exceeds the latency lose no packet (checked on every row of the slice: both alphabets, both LOS cases, both Es/N0); tick-based untimed semantics lose up to the stated fraction (largest PER of the slice, in the F9b cases: LOS present at the pre-declared 15 dB sensitivity, LOS blocked at 25 dB). Conclusion qualifier: the difference appears where a switch costs bits; with the LOS present at 25 dB no semantics lost more than the stated small fraction. Not claimed for the 0.1 and 1 ms guards, where some 15 dB rows lose one packet in 2000 to noise."
    where: [sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [fig:F9, test:VA-5, test:E-B, pytest:tests/unit/test_eb_arc.py, pytest:tests/runtime/test_eb_arc_va5.py]
    gates: []
  C-ABS-EA:
    text: "E-A headline (position-driven binary control under signaling delay)."
    where: [sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [fig:F10, test:VA-1]
    gates: [H-6]

  # ================================================================ III Design
  C-ARCH:
    text: "The engine runs in the application's process (Device.inproc) or as a served process (Device.connect) behind one engine interface; a run with TX and RX in two OS processes gives bitwise the same RX samples as in one process."
    where: [sections/03_design.tex]
    evidence: [test:IO-02, test:IO-06, pytest:tests/io/test_io_api_device.py::test_api_recv_chunking_is_invisible, pytest:tests/io/test_io_wp8_serve_cli.py, fig:F1]
    gates: []
  C-PLANES:
    text: "A served engine uses ZMQ on three planes: framed IQ (TX ingress PUSH/PULL, per-RX egress), raw REQ/REP peers, JSON control on ROUTER (barriers to registered controllers on the same connection, never PUB) and telemetry on PUB; a session can start paused (default of the serving command)."
    where: [sections/03_design.tex]
    evidence: [test:IO-02, test:IO-03, test:RT-08, pytest:tests/io/test_io_wp8_lifecycle.py, pytest:tests/io/test_io_wp8_messages.py, pytest:tests/io/test_io_wp8_serve_cli.py, cite:ZeroMQ, fig:F1]
    gates: []
  C-RECORDING:
    text: "Each run directory holds the manifest (versions, git commit and dirty flag, platform, seeds and RNG scheme, input hashes and data classes, mode, backend, per-link interpolation/filter choices, counters), the resolved scenario, an append-only flushed event log, a metrics log per window and optional SigMF recordings with command annotations; replay and a static HTML report read run directories."
    where: [sections/03_design.tex]
    evidence: [test:IO-05, test:RT-16, pytest:tests/unit/test_manifest.py, pytest:tests/io/test_io_eventlog.py, pytest:tests/io/test_io_report.py, cite:SigMF]
    gates: []
  C-TIMEBASE:
    text: "Exact rational rates and times; to_ticks = floor(t f + 1/2) (UHD rounding, error <= 1/(2f)); count = ceil(t1 f) - ceil(t0 f) for any mix of rates; API floats via their shortest decimal; wall time never enters data-plane arithmetic."
    where: [sections/03_design.tex]
    evidence: [test:RT-01, test:RT-02, test:RT-15, cite:UHDManual]
    gates: []
  C-INVARIANCE:
    text: "Pages P_r = clamp(2^round(log2 f T_p), P_min, P_max) on an absolute grid, cut into segments; closed-form per-sample quantities, anchored recursions, fixed summation order: RX output bitwise invariant to client chunking, event/barrier/availability cuts, skipped pages and thread count (deterministic mode); a page-target change is not bit-exact and stays within the RT-04 relative tolerance on the complex128 accumulators."
    where: [sections/03_design.tex]
    evidence: [test:RT-03, test:RT-04, test:RT-10, fig:F2]
    gates: []
  C-LATE-CMD:
    text: "A late command (some switch sample below the frontier) is moved by apply_on_arrival to t' = max_{r,j}(frontier_r/f_r - tau_{r,j}) and re-mapped on every receiver; the record keeps requested/applied samples and lateness; reject returns LATE_COMMAND."
    where: [sections/03_design.tex]
    evidence: [test:RT-06, fig:F2]
    gates: []
  C-TIES:
    text: "Every command is kept; at equal time on one panel the later seq wins and the earlier is superseded; commands at different future times both apply."
    where: [sections/03_design.tex]
    evidence: [test:RT-07]
    gates: []
  C-RECORDS:
    text: "One record per command with id, seq, source, op, requested/applied surface time, per-RX requested/applied samples, lateness, wall receipt/delivery times, status and a BLAKE2b hash of the applied configuration."
    where: [sections/03_design.tex]
    evidence: [test:RT-06, test:IO-05, pytest:tests/io/test_io_eventlog.py, pytest:tests/unit/test_contracts.py::test_panel_config_hash_matches_independent_blake2b]
    gates: []
  C-COUNTERFACTUAL:
    text: "RIS absent/present is a separate counterfactual timeline with per-receiver switch samples, flagged in its records, that never changes element states."
    where: [sections/03_design.tex]
    evidence: [pytest:tests/runtime/test_rt04_and_events.py::test_set_enabled_counterfactual_removes_ris_paths_per_tile, pytest:tests/io/test_io_api_device.py::test_api_marker_and_set_enabled_records]
    gates: []
  C-TRANSITIONS:
    text: "Transition classes with step, linear or exponential profiles; h = h_old + sum_c g_c dh_c exactly by linearity, dh_c interpolated between snapshots (valid under mobility); re-command starts from the instantaneous Gamma; default duration reconfiguration_time_s; complex-linear path is ENG."
    where: [sections/03_design.tex]
    evidence: [test:RT-12, cite:ETSI_GS_RIS008]
    gates: []
  C-BARRIERS:
    text: "Barriers at t_b = m T_c: every RX computed to to_ticks(t_b + L_min) first; observation from samples before to_ticks(t_b) (IQ-measured power, RIS state; optional positions, IQ window, oracle CSI flagged); actions at t_b + latency >= L_min, earlier raises LOOKAHEAD_VIOLATION; lateness 0 by construction; decision time does not change RX samples; in-process and remote controllers give identical RX."
    where: [sections/03_design.tex]
    evidence: [test:RT-08, test:RT-17, fig:F2]
    gates: []
  C-LOCKSTEP:
    text: "Lockstep TX commitment by samples, end of burst or idle_until; RX pages wait for linked TX; stall report after the stall timeout; barrier runs deterministic; unregistered timed commands deterministic when on time, else nondeterministic_inputs."
    where: [sections/03_design.tex]
    evidence: [test:RT-13, test:RT-08, test:RT-06]
    gates: []
  C-PACED:
    text: "Paced release R_j = t0 + k1/f + D_lag with hybrid sleep; late timed TX bursts dropped (time error), untimed gaps zero-filled (underflow), RX overflow drops pages, misses counted at the default slacks; paced mode is soft real time; lockstep + async is rejected."
    where: [sections/03_design.tex]
    evidence: [test:RT-18, pytest:tests/io/test_io_wp8_backpressure.py, spec:DESIGN-4.10]
    gates: []
  C-BATCH:
    text: "The batch path evaluates combine(snapshot(t), cfg(t)) with the same model, commands, controllers and RNG keys, switches at surface time and reports tau_RIS->r; in a static scene with noise off, an in-process controller and no signaling delay its time-averaged power equals the IQ path's within the VA-4 relative tolerance (VA-4 covers the static lab_like_A scene only; mobility agreement is VA-1, not claimed here)."
    where: [sections/03_design.tex]
    evidence: [test:VA-4]
    gates: []
  C-REPLAY:
    text: "Replay re-injects recorded TX streams and commands at their applied times and reproduces RX bitwise, with each command at its recorded k_applied."
    where: [sections/03_design.tex]
    evidence: [test:RT-16]
    gates: []
  C-API:
    text: "UHD-shaped Python API (not UHD-compatible): TX/RX streams, UHD-style metadata with exact time specs, UHD stream modes, status codes (UHD RX and async codes plus sremu codes), timed RIS commands, set_command_time, one channel per stream; Table III generated from the code."
    where: [sections/03_design.tex, generated/tables/table3_api.tex]
    evidence: [test:IO-06, pytest:tests/io/test_io_api_device.py::test_api_table_iii_rows, pytest:tests/io/test_io_api_device.py::test_api_command_time_and_time_forms, pytest:tests/io/test_io_api_device.py::test_api_streamargs_rates_are_exact, table:tab:api, cite:UHDManual]
    gates: []
  C-COMPAT:
    text: "Send_to_sim / Receive_from_sim give simple scripts a one-call interface; a BPSK transmitter and receiver script pair delivers every sample through them."
    where: [sections/03_design.tex, generated/tables/table3_api.tex]
    evidence: [test:IO-07]
    gates: []
  C-FRAMES:
    text: "48-byte little-endian frame header (magic, version, flags, stream id, seq, first sample, count, nchan, dtype, wall clock), zero-copy payload; malformed frames dropped and counted; TX blocks at HWM (lockstep backpressure)."
    where: [sections/03_design.tex]
    evidence: [test:IO-01, test:IO-02, pytest:tests/io/test_io_wp8_backpressure.py]
    gates: []
  C-CONTROL:
    text: "JSON control envelope validated in order size (1 MiB), syntax, element count (65,536), schema; every refusal one code, counted; messages above the 16 MiB ZMQ MAXMSGSIZE close the connection without a reply (not counted); operations as listed; socket commands land at the exact sample with zero lateness in lockstep."
    where: [sections/03_design.tex]
    evidence: [test:IO-01, test:IO-03, test:IO-04, pytest:tests/io/test_io_wp8_messages.py]
    gates: []
  C-SECURITY:
    text: "No message field is a file path; loopback binding unless remote binding is allowed; no authentication; per-client command rate limit refused and counted."
    where: [sections/03_design.tex]
    evidence: [test:IO-04]
    gates: []
  C-RAW:
    text: "srsRAN-style raw REQ/REP mode (lockstep): request formats pinned from srsRAN 4G and GNU Radio sources, tested against stub peers; no real srsRAN/GNU Radio binary run yet."
    where: [sections/03_design.tex]
    evidence: [test:IO-08, cite:srsRANZMQ]
    gates: []
  C-TABLES:
    text: "Response tables Gamma(s,f,theta_i,theta_s) on one angle grid with mandatory provenance fields (source kind, description, reference, reference plane, polarization, cell pattern flag, sigmas, raw hash, licence, creation record, transformations)."
    where: [sections/03_design.tex]
    evidence: [test:PH-31, pytest:tests/physics/test_ph31_validators.py]
    gates: []
  C-TABLE-CHECKS:
    text: "Validators: passivity (sigma-aware for measured/digitized), reciprocity (sigma-derived tolerance; recorded symmetrization), grid density, domain, bandwidth; complex-linear interpolation; incidence-only tables via the recorded half-difference extension; raw non-reciprocal tables rejected."
    where: [sections/03_design.tex]
    evidence: [test:PH-31, test:PH-28]
    gates: []
  C-TABLE-IMPORT:
    text: "CSV long form + provenance sidecar, MATLAB S-curve importer (simulated stand-in); built-ins: lab binary (assumed amplitudes), Tang RIS1/RIS2, ideal b-bit, antipodal, on-off, Abeywickrama; Monte Carlo sampling from stated sigma."
    where: [sections/03_design.tex]
    evidence: [test:PH-31, pytest:tests/physics/test_ph31_builtin_tables.py, pytest:tests/unit/test_states_cli.py, cite:Tang2022mmWave, cite:Mishra2025WCL, cite:Abeywickrama2020Practical]
    gates: []
  C-CAPS:
    text: "Panel capabilities with GS RIS 008 parameter names where they exist (n_elements, layout, control_granularity, states, gamma_source, operating_band_hz, max_bandwidth_hz, reconfiguration_time_s, max_command_rate_hz, static_power_w as metadata)."
    where: [sections/03_design.tex]
    evidence: [pytest:tests/unit/test_contracts.py::test_ris_capabilities_defaults_and_dict, pytest:tests/io/test_io_wp8_messages.py::test_rt08_caps_roundtrip_with_nonfinite_floats, cite:ETSI_GS_RIS008, table:tab:standards]
    gates: []

  # ================================================================ IV Physical model
  C-STACK:
    text: "Analytic trajectories (static, waypoints, constant velocity, RWP 1-D/2-D, trace, external); snapshot in f64 gives non-RIS paths and B[r,s,n] per panel (rows = link x ground hop variant; separable form for angle-free tables); combine linear in Gamma; Friis-normalized coefficients; baseband conventions."
    where: [sections/04_physical_model.tex]
    evidence: [test:ST-01, test:PH-08, test:PH-32, pytest:tests/physics/test_ph_geometry_trajectories.py, pytest:tests/physics/test_ph_propagation_contract.py::test_contract_combine_linear_in_gamma_and_disabled_panel, pytest:tests/physics/test_ph_propagation_contract.py::test_contract_angle_dependent_table_uses_b_form, cite:Bettstetter2003RWP]
    gates: []
  C-LOS:
    text: "LOS with scalar co-polar patterns (isotropic, cos^alpha with peak 2(alpha+1), tabulated) and explicit visibility (occluder 0, partition 10^(-L/20) [ENG], knife edge F(nu) coherent with RIS paths); optional ground image, RIS hop image expansion, order-1 walls, additive diffuse."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-01, test:PH-27, test:PH-11, test:PH-10, test:PH-32, test:PH-08, test:ST-02]
    gates: []
  C-K1:
    text: "K1 kernel as in Eq. (k1): pitch areas A_q summing to the cell pitch area, default obliquity sqrt(cos cos), Huygens j, front-side indicator (back side exactly zero)."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-02, test:PH-09, cite:Tang2022mmWave]
    gates: []
  C-K1-AREA:
    text: "Area tie makes fixed-aperture power independent of subdivision (a fixed per-cell gain would grow); j fixes the RIS-vs-LOS phase (a kernel without j fails image theory)."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-04, test:PH-05]
    gates: []
  C-K1-FORMS:
    text: "For point cells K1 equals Tang et al.'s cell model times j, ETSI GR RIS 003 clause 6.3.1.2 with G = 4 pi dx dy / lambda^2, and Ellingson's model with area-tied element gain, to double precision."
    where: [sections/04_physical_model.tex, sections/10_conclusion.tex]
    evidence: [test:PH-02, cite:Tang2022mmWave, cite:ETSI_GR_RIS003_v121, cite:Ellingson2021PathLoss]
    gates: []
  C-K1-GUARDS:
    text: "Scenario check warns below three wavelengths and rejects below one; default obliquity energy-bounded; Kirchhoff option warns."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-23, pytest:tests/unit/test_scenario_guards.py]
    gates: []
  C-CELL-MODEL:
    text: "cell_model point / po_patch (sub-cells <= 0.2 lambda) / auto (point up to 0.5 lambda pitch); forced point on larger cells warns; includes_cell_pattern forces point without obliquity; models differ off specular (model-form uncertainty)."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-04, test:PH-26, cite:Tang2022mmWave]
    gates: []
  C-RICHARDSON:
    text: "Richardson check for po_patch: up to 8 representative links at Delta and Delta/2, at most 2 halvings to 0.05 dB, else failure; result in the manifest."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-04, pytest:tests/physics/test_ph04_refinement.py]
    gates: []
  C-NONIDEAL:
    text: "Ordered non-ideality pipeline: granularity expansion, quantizer argmax Re{Gamma e^-j phi} (unequal amplitudes), failure map (dead absorbing), table at cell angles, efficiency sqrt(eta) refused for measured/digitized unless overridden, coupling hook without coefficients, transition; closed-form checks."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-13, test:PH-15, test:PH-25, test:PH-30, test:ST-03, cite:ETSI_GR_RIS003_v121]
    gates: []
  C-OPTIMUM:
    text: "Exact finite-alphabet optimum by a critical-angle sweep, O(S^2 N log(S^2 N)), equal to exhaustive search on every tested instance; not claimed as new."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-24, test:PH-29, cite:Zhang2022OptimalBinary, cite:Zhao2024OptimalDiscrete]
    gates: []
  C-DOPPLER:
    text: "Geometric Doppler: absolute snapshot grid; chord delay with exact carrier phase and complex-linear amplitude per non-RIS path; RIS rows split into tiles (reference delay + interpolated residual); switches never interpolated across."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-17, test:PH-18, test:PH-19]
    gates: []
  C-INTERP-BOUND:
    text: "One target eps_rel split in half between chord (T_curv formula) and tile residual; T_u0 = min(T_curv, cap), halvings up to M_MAX, cheapest feasible pair; scenario can lower T_u only."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-18, test:PH-19]
    gates: []
  C-VERIFY-INTERP:
    text: "verify_interp evaluates the exact midpoint snapshot every 64th interval, logs the max relative error per link, keeps the maximum in the manifest and flags runs above 2 eps_rel."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-18]
    gates: []
  C-FD:
    text: "Narrowband test pi B dtau <= 0.05 rad; otherwise grouped paths with one FD filter per group; Kaiser-sinc (beta 8) with 8/16/32 taps for B/f_s up to 0.2/0.6/0.8, 1024-phase polyphase table with linear interpolation, in-band error below -60 dB; wider bands rejected; integer delay when pi B/(2 f_s) <= 0.05."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-20, test:RT-11, cite:Laakso1996FracDelay]
    gates: []
  C-NOISE:
    text: "Thermal noise once per receiver, power k_B T0 F f_s (T0 = 290 K)."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-21, test:G5]
    gates: []
  C-RNG:
    text: "Keyed variates: BLAKE2b-derived keys of (seed, purpose, name), Philox4x32-10 counter = absolute index; adding nodes or rechunking changes no other variate; backends produce identical integer streams; CFO as phase of the absolute index; Wiener PN; front end."
    where: [sections/04_physical_model.tex]
    evidence: [test:RT-14, test:RT-09, test:G4, pytest:tests/runtime/test_noise_oscillator.py, pytest:tests/runtime/test_noise_frontend.py, cite:Salmon2011Philox]
    gates: []

  # ================================================================ VIII Discussion
  C-STANDARDS:
    text: "Table VI maps GR RIS 002 (controller / micro-controller / control signalling), GR RIS 003 (5.1.2, 5.1.3, 6.3.1.2, 6.6, 6.8) and GS RIS 008 (4.1-4.8) to sremu elements; alignment, not conformance; EVM row used by the E-B study."
    where: [sections/08_discussion.tex, sections/tables/table6_standards.tex]
    evidence: [table:tab:standards, cite:ETSI_GR_RIS002_v121, cite:ETSI_GR_RIS003_v121, cite:ETSI_GS_RIS008, test:PH-02, test:PH-05, test:PH-23, test:PH-26, test:PH-30, test:PH-31, test:RT-05, test:RT-06, test:RT-08, test:RT-12, test:RT-17, test:IO-03, test:G2, test:G3, fig:F9]
    gates: []
  C-TSDSI:
    text: "The text of TSDSI STD 5003 was not accessed; no alignment is claimed."
    where: [sections/08_discussion.tex]
    evidence: [cite:TSDSI_STD5003, spec:DESIGN-8.9]
    gates: []
  C-CONTROLLER-API:
    text: "Controller protocol (name, period, min latency, observation spec, latency model; setup with capabilities and keyed generator; decide) runs in process or remotely with identical RX; built-ins as listed (incl. a reading of the WCL heuristic and a UCB1 bandit); keyed randomness."
    where: [sections/08_discussion.tex]
    evidence: [test:RT-08, test:VA-3, pytest:tests/unit/test_wp9_controllers.py, pytest:tests/unit/test_wp9_rng_reproducibility.py, cite:Mishra2025WCL, cite:Auer2002UCB]
    gates: []
  C-RISENV:
    text: "RisEnv: Gymnasium reset/step (subclass when installed, duck-typed otherwise), state or codebook actions after a latency, pilot-tone power reward, keyed samplers; batch path only in this release (IQ backends not connected)."
    where: [sections/08_discussion.tex]
    evidence: [pytest:tests/unit/test_wp9_env.py, pytest:tests/unit/test_wp9_gym_quickstart.py, cite:Towers2024Gymnasium]
    gates: []
  C-REGRET:
    text: "RisEnv reports the exact finite-alphabet optimum from oracle CSI and the regret gap (zero for an optimal controller; can be negative with dead cells); the optimum bounds every built-in controller at every tested position."
    where: [sections/08_discussion.tex]
    evidence: [test:VA-3, pytest:tests/unit/test_wp9_env.py::test_env_regret_is_zero_at_the_exhaustive_optimum_and_nonnegative, pytest:tests/unit/test_wp9_env.py::test_rollout_exact_optimum_has_zero_regret_and_ris_absent_drops_the_ris]
    gates: []
  C-LIMITS:
    text: "Limitations table from DESIGN 1.5 plus the batch-only RisEnv; paced mode is soft real time; MATLAB agreement is code-to-code; coupling via tables."
    where: [sections/08_discussion.tex, sections/tables/table_limitations.tex]
    evidence: [spec:DESIGN-1.5, table:tab:limitations, cite:Gurses2026ACHEM, cite:ETSI_GR_RIS003_v121]
    gates: []

  # ================================================================ Appendix
  C-ORACLES:
    text: "Four test tiers: analytic (PH/RT/IO), statistical (ST), MATLAB code-to-code (G1-G8, MATLAB not needed to run), validation/reproduction (V)."
    where: [sections/appendix.tex]
    evidence: [test:G1, test:G2, test:G3, test:G4, test:G5, test:G6, test:G7, test:G8, test:ST-01, test:ST-02, test:ST-03, spec:DESIGN-10.1]
    gates: []
  C-ORACLE-INDEPENDENCE:
    text: "Closed-form oracles live in a separate package that may not import physics/channel/impair (static and fresh-interpreter checks); the oracle families are as listed."
    where: [sections/appendix.tex]
    evidence: [pytest:tests/oracles/test_oracle_isolation.py, pytest:tests/unit/test_layering.py::test_oracle_isolation, pytest:tests/unit/test_layering.py::test_oracle_isolation_teeth, pytest:tests/oracles/test_oracles_pm_checks.py]
    gates: []
  C-TEETH:
    text: "Several guards have a negative-control twin that runs a deliberately wrong variant (kernel without j, too-short fractional-delay filter, replay with a dropped command) and must reject it. DESIGN D24: the teeth tests that reproduce earlier code (kernel without the area tie, block-constant Doppler, next-tick semantics) stay in the suite but are not featured in the paper."
    where: [sections/appendix.tex]
    evidence: [test:PH-05, test:PH-20, test:RT-16]
    gates: []
  C-REPRO:
    text: "Two repositories; tasks.py paper-junit records the test run with commit and dirty flag; build_paper.py --mode final refuses unless lock = installed commit, clean trees, green gates of that commit, current figures, pipeline macros and supported claims; code constants read from the locked code; manifests and bitwise replay."
    where: [sections/appendix.tex]
    evidence: [spec:DESIGN-13.5, test:RT-16]
    gates: []
  C-PROVENANCE:
    text: "Data classes MEAS (measured data), DIG, REPORTED, ASSUMED, SIM-sremu, ANALYTIC, MATLAB on every input and figure; manifests list input hashes and classes; private data read from a private location with skipping tests; the laboratory measurement collected by the authors enters as a digitized map (DIG)."
    where: [sections/appendix.tex]
    evidence: [pytest:tests/unit/test_manifest.py, spec:DESIGN-3.6, spec:DESIGN-10.1]
    gates: []

  # ================================================================ V Verification and validation
  C-VV-TABLE:
    text: "Table IV (generated from the pinned junit): every analytic identifier (PH, RT, IO) passes; ST and G tiers as counted; total passed and skipped tests; no skipped test carries a spec id."
    where: [sections/05_verification_validation.tex, generated/tables/table4_vv.tex]
    evidence: [table:tab:vv, test:PH-01, test:PH-02, test:PH-04, test:RT-01, test:RT-03, test:RT-05, test:RT-08, test:IO-01, test:IO-02, test:ST-01, test:ST-04, test:G1, spec:DESIGN-10.1]
    gates: []
  C-MATLAB:
    text: "Goldens G1-G8 from MATLAB R2026a scripts pass; this is code-to-code agreement, not validation; G2/G3 compare beam shapes after removing a documented constant and say nothing about absolute RIS power."
    where: [sections/05_verification_validation.tex]
    evidence: [test:G1, test:G2, test:G3, test:G4, test:G5, test:G6, test:G7, test:G8, cite:ETSI_GR_RIS003_v121, spec:DESIGN-10.6]
    gates: []
  C-REFINE:
    text: "Fixed-aperture refinement (F3a): K1 with the default cell model stays within the stated deviation of the far-field closed form for every N; the patch model stays within the stated deviation of the continuous PO integral near field; the point model converges slowly (model-form difference)."
    where: [sections/05_verification_validation.tex]
    evidence: [test:PH-04, test:PH-26, fig:F3]
    gates: []
  C-LAB-DATA:
    text: "The V-LAB data set is a laboratory measurement collected by the authors (3.5 GHz, 30 cells, binary RIS of six tiles), surviving as a colour map, digitized (DIG) with per-cell uncertainty; the geometry is known within ranges."
    where: [sections/05_verification_validation.tex, sections/appendix.tex]
    evidence: [test:V-LAB, fig:F4, spec:DESIGN-10.9]
    gates: [H-1]
  C-LAB-PREREG:
    text: "The analysis plan (prior, models M0-M3, split, decision rules C1-C3) was fixed and hash-locked before any model-data comparison; the loader refuses data unless the hash matches; commit, date and deposit DOI are pipeline placeholders until H-6."
    where: [sections/05_verification_validation.tex]
    evidence: [test:V-LAB, spec:DESIGN-10.9]
    gates: [H-6]
  C-LAB-POWER:
    text: "Before unblinding, the decoy power analysis (500 decoys from M2) gave a C2 detection rate of 0, below the 0.5 threshold: labelled underpowered. The decoy counts of C1 and C3 are reported with it (protocol paper_wording)."
    where: [sections/05_verification_validation.tex]
    evidence: [test:V-LAB, fig:F4]
    gates: [H-6]
  C-LAB-RESULT:
    text: "Unblinded outcome: C1, C2, C3 fail (also in every sensitivity run); median test RMSE of M0, M0n, M2 and bias as generated; null result, underpowered, not evidence for or against the model; one colour-scale-pinned cell is an outlier."
    where: [sections/05_verification_validation.tex, generated/tables/table5_lab.tex]
    evidence: [test:V-LAB, fig:F4, table:tab:lab]
    gates: [H-6]
    banned_word_uses:
      - {word: only, context: "from LOS-only"}
  C-LAB-LESSON:
    text: "Diagnostic outside the protocol: no single extra lab fact raises the C2 detection rate above 0; exact tile geometry plus positions to +-1 mm gives the stated rate (close to the 0.5 threshold); a RIS map at 3.5 GHz needs geometry recorded to about a millimetre before it can separate the models."
    where: [sections/05_verification_validation.tex, sections/10_conclusion.tex]
    evidence: [test:V-LAB, spec:DESIGN-10.9]
    gates: []
  C-CFO:
    text: "Noise-free CFO sweep: LS and lag-1 estimators recover the applied offset within the stated errors; the received samples are identical for client epochs of 0.25, 2 and 3.7 ms (V-CFO-1); the same sweep across two OS processes over native ZMQ is bitwise identical (V-CFO-3)."
    where: [sections/05_verification_validation.tex]
    evidence: [test:V-CFO-1, test:V-CFO-3, test:G4, fig:F5]
    gates: []
  C-CFO-LESSON:
    text: "Generic design lesson (D24, no simulator named): delivering a whole number of samples per tick scales every frequency estimate by the ratio of needed to delivered samples (11.76/11 here); reproduced by re-timing sremu's own output; exact rational counts remove it."
    where: [sections/05_verification_validation.tex]
    evidence: [test:V-CFO-2, test:RT-01, fig:F5, spec:DESIGN-D24]
    gates: []
  C-CRB:
    text: "With the emulator's physical noise a periodogram estimator reaches the CRB (pooled ratios as generated; the lowest, below 1, is 2.3 standard errors from 1 and read as sampling error; worst offset within 1.5 x CRB); the lag-1 estimator follows its own small-error theory."
    where: [sections/05_verification_validation.tex, sections/10_conclusion.tex]
    evidence: [test:ST-05, test:V-CFO-1, fig:F5, cite:Kay1989Freq]
    gates: []
  C-BER:
    text: "BER through the emulator (physical noise): theory inside the 95 % Clopper-Pearson interval at every point with genie CSI; outside at the stated number of low-Eb/N0 points with 64-pilot LS (estimation loss); ST-04 is the CI version."
    where: [sections/05_verification_validation.tex]
    evidence: [test:ST-04, fig:F5]
    gates: []
  C-DOPPLER-VV:
    text: "Rendered LOS Doppler equals the closed form within the stated deviation; the RIS contribution follows an independent per-cell K1 sum where the reference RIS amplitude exceeds 10 % of its maximum (away from pattern nulls); interpolation error at auto T_u far below eps_rel, growing as T_u^2; verify_interp follows it but reads low (up to the stated percentage)."
    where: [sections/05_verification_validation.tex]
    evidence: [test:PH-17, test:PH-18, test:PH-19, fig:F6]
    gates: []

  # ================================================================ VII Case studies
  # E-B: primary geometry modelled on the lab arrangement (SIM, nominal geometry), AWS run
  # 20261011T060442Z_eb_arc_d41a75 on c7i.16xlarge at sremu 5be649a (clean per the job's
  # SREMU_GIT_COMMIT export; the commit's src/sremu tree hash equals the run's,
  # paper/sweeps/results/E-B-arc/meta.json sremu.commit_verified); lab-like SIM geometry as
  # the supporting row. Every number is a gen_results.py macro read from those results.
  C-EB-WHY:
    text: "Block-coefficient tools cannot place a reconfiguration inside a packet; GS RIS 008 lists reconfiguration time and modulated-signal quality; E-B measures how the two interact."
    where: [sections/07_case_studies.tex]
    evidence: [cite:ETSI_GS_RIS008, test:E-B, fig:F9]
    gates: []
  C-EB-SETUP:
    text: "E-B setup. Primary geometry modelled on the lab arrangement (SIM, nominal geometry: every distance or angle known only within a range takes the middle of that range; not the measured geometry; no measurement compared): six tiles of 5 x 8 cells on an arc around the Tx acting as one surface, joint exact optimum per receiver over all cells, one command per tile for the same time. Lab-like SIM geometry (one panel of three tiles) as the supporting case. Receiver positions (1.2 m from the Tx at two angles) are an engineering choice [ENG]. Assumptions for both: |Gamma| = 1 (ASSUMED), complex-linear transition [ENG], the LOS-blocked occluder removes the LOS only (idealized on the arc, where a real plate would also shadow RIS rays). QPSK packets, one-shot preamble equalizer, Es/N0 at RX1."
    where: [sections/07_case_studies.tex]
    evidence: [test:E-B, pytest:tests/unit/test_eb_arc.py, fig:F9, spec:DESIGN-11-E-B]
    gates: []
  C-EB-MECH:
    text: "E-B1/VA-5 on both geometries: in every step switch inside a packet the earliest affected sample equals to_ticks(t_sw + tau) and earlier samples are bitwise identical; on the arc each tile's command applies at its own to_ticks(t_sw + tau_tile). Arc, LOS blocked: channel change and rotation as generated, EVM before the switch unchanged, many payload bit errors after a switch at T_p/4 (also with a 200 us linear transition). Arc, LOS present: smaller change, EVM rises, the stated number of bit errors (one in this run)."
    where: [sections/07_case_studies.tex]
    evidence: [test:VA-5, test:RT-05, pytest:tests/runtime/test_eb_arc_va5.py, fig:F9]
    gates: []
  C-EB-TIMING:
    text: "E-B2 on the arc, 0.5 ms guard, cases fixed before the run (eb_plan.json): LOS present at Es/N0 25 dB: no semantics loses more than the stated (small) fraction. LOS present at the pre-declared 15 dB sensitivity and LOS blocked at 25 dB (F9b): tick-based untimed semantics lose the stated large range at every jitter, also without jitter (the two cases show the same pattern); late timed commands apply on arrival; timed commands lose no packet while the lead exceeds the worst latency (2 ms lead: none up to J = 1 ms, losses at J = 3 ms; 0.5 ms lead: losses at J = 1 ms; 5 ms lead: none at any J); asap commands lose none while the worst latency fits in the guard and fail beyond it. Requirement stated as: a timed command loses no packet when its lead exceeds the worst latency; an untimed one loses none while the worst latency fits in the guard (sufficient conditions, as measured). gen_results.py checks the lead and guard rules on every row of the two cases."
    where: [sections/07_case_studies.tex]
    evidence: [test:E-B, test:RT-07, pytest:tests/runtime/test_eb_arc_va5.py::test_eb2_point_arc_tick_based, fig:F9]
    gates: []
  C-EB-LABLIKE:
    text: "Supporting lab-like SIM geometry (F9c,d), LOS blocked at 25 dB: channel change and bit errors after the switch; timed commands with a 2 ms lead lose no packet up to J = 1 ms and the stated fraction at J = 3 ms; asap and tick-based losses as generated; LOS present: no packet lost at 25 dB (checked); no 15 dB run in this geometry."
    where: [sections/07_case_studies.tex]
    evidence: [test:E-B, test:VA-5, fig:F9]
    gates: []
  C-EA-SETUP:
    text: "E-A setup: corridor, 1-D RWP, on-off RIS line, LOS partition; under the area-tied kernel the unblocked-corridor optimum gain is as generated; controllers; batch path; pre-registered hypotheses with one disclosed amendment."
    where: [sections/07_case_studies.tex]
    evidence: [test:E-A, test:W2, cite:Mishra2025WCL, fig:F10]
    gates: [H-6]
  C-EA-RESULT:
    text: "E-A: optimum gain (mean of per-batch dB) and tau_half with CIs; H-A1, H-A2, H-A3 supported; time scale set by lambda/v, not the mobility period."
    where: [sections/07_case_studies.tex, sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [test:E-A, fig:F10]
    gates: [H-6]
  C-VA1:
    text: "VA-1 (consistency check, not a finding): IQ path through the served engine with external controller and RX application agrees with the batch path within the stated difference (limit 0.02 dB)."
    where: [sections/07_case_studies.tex]
    evidence: [test:VA-1, fig:F10]
    gates: []
  C-EC:
    text: "E-C ablation (short analytic result, exact optimum): losses per alphabet and geometry as generated; lab states nearly antipodal (|d|, |m|); unequal amplitudes and ideal-design deployment cost more."
    where: [sections/07_case_studies.tex, generated/tables/table8_ablation.tex]
    evidence: [test:PH-24, test:PH-25, test:PH-29, fig:F11, table:tab:ablation, cite:WuZhang2020Discrete, cite:Abeywickrama2020Practical]
    gates: []
  C-ED:
    text: "E-D (model-based dimensioning, not validated): required aperture range; RIS-minus-direct gap at grazing over every distance and height of F12; the 56.25 m^2 panel suffices in none of the primary map entries; the four-ray sensitivity and the experimental P.526 direct path change the count."
    where: [sections/07_case_studies.tex]
    evidence: [test:PH-10, test:PH-11, test:V-FM, fig:F12]
    gates: []
  C-EE:
    text: "External-process runs so far: V-CFO-3 (two processes, native ZMQ) and VA-1 (external controller and RX app); no srsRAN or GNU Radio binary run yet."
    where: [sections/07_case_studies.tex]
    evidence: [test:V-CFO-3, test:IO-02, test:IO-08]
    gates: []
