  C-LAB-PRESPEC:
    text: "The analysis plan (prior, models M0-M3, split, decision rules C1-C3) was fixed and hash-locked before any model-data comparison (after a descriptive inspection of the digitized map); the loader refuses data unless the hash matches. Facts from GitHub's server-side push log (sweeps/results/V-LAB-provenance, checked by gen_results): lock commit 101ee87 pushed 2026-10-11 00:22:55 UTC; two commits followed (content read from the sremu repository objects, not from GitHub's records): 2ef1401 adds a --columns option to validation/ants_fig4b/run.py (column names of the measured CSV), and 7a63287 (pushed 00:30:30 UTC) changes only the V-LAB smoke test; unblinded run started 00:30:44 UTC from a clean tree of 7a63287 (V-LAB record); result commit 2333b60 pushed 00:31:40 UTC. No public registry deposit before unblinding (stated); a retrospective deposit remains possible. Wording: pre-specified, hash-locked; never pre-registered."
