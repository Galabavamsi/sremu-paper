  C-LAB-LESSON:
    text: "Diagnostic outside the protocol: no single extra lab fact raises the C2 detection rate above 0; exact tile geometry plus positions to +-1 mm gives the stated rate (close to the 0.5 threshold); a RIS map at 3.5 GHz needs geometry recorded to about a millimetre before it can separate the models."
    where: [sections/05_verification_validation.tex, sections/10_conclusion.tex, sections/app_d_vv.tex]
    evidence: [test:V-LAB, spec:DESIGN-10.9]
