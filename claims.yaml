  # ================================================================ VI Wall-clock behaviour
  # Benchmarks B1, B2 (AWS, sremu 309c633), B2-F45, B3, B4, B4-classic (AWS, bf08268) and B6
  # (laptop, 06cdf7a), copied with provenance in paper/sweeps/results/bench; E-F latency from
  # the regeneration job (sweeps/results/E-F/latency). Every number is a bench_results.py macro
  # (MEAS). Analysis: research/analysis/bench_findings.md and ab_paced_aws.md.
  C-WC-DEFS:
    text: "Definitions as in DESIGN 12.1: lockstep vs paced (release R_j; a received sample is delivered between D_lag (default 1 ms, code macro) plus the page's computation and one page more after its wall time, must-fix 1); RTF = min over received streams of samples/f_s per wall second; page latency = delivery - R_j; miss at slack s when latency > s, so the miss rate is the latency CCDF and zero slack is missed by construction (computation starts at R_j); Sustainable = >= 60 s after a 5 s warm-up, miss rate < 1e-3 at 1 ms slack, no late input samples, no overflowing pages; headless (streams generated and consumed in the emulator process, no client processes, transport or control socket: an engine-alone bound) and served (samples or commands over sockets); a link is a TX-RX pair (L = n_tx n_rx; 8 links = 2 TX x 4 RX); visible latency of a command; a timed command is late when its switch sample was computed before its receipt and is then applied on arrival."
    where: [sections/06_wallclock.tex, sections/app_e_bench.tex]
    evidence: [spec:DESIGN-12.1, spec:DESIGN-4.10, test:RT-18]
    gates: []
  C-WC-HOSTS:
    text: "Hosts and protocol: B1/B2 on an AWS c7i.48xlarge at 309c633 (recorded dirty flag, uploaded bundle byte-identical to the commit's tree; bench meta.json dirty_note), B2-F45 on another c7i.48xlarge and B3, B4, B4-classic on three c7i.8xlarge instances at bf08268 from a clean tree (engine pinned to 16 logical CPUs, command client on 4, the rest idle), B6 on the laptop at 06cdf7a (clean); B2 and B2-F45 packed up to 11 points of 16 logical CPUs; paced points ran 3 repetitions of 60 s (>= 46,876 pages each) and count as Sustainable only when every repetition is; L doubled while Sustainable, the first unsustainable repetition ends point and series; headless runs have no external inputs (late-input condition trivially met, must-fix 18); benchmark scenes carry no physical result (Table tab:platforms)."
    where: [sections/06_wallclock.tex, generated/tables/table7_platforms.tex, sections/app_e_bench.tex]
    evidence: [table:tab:platforms, table:tab:provenance, spec:DESIGN-12.3]
    gates: []
  C-WC-LOCKSTEP:
    text: "B2 lockstep (309c633, packed): points planned/run/ok/below floor/failed as generated, every failure an F5 point (three receive time-outs from a benchmark configuration error and one benchmark error below the floor, both fixed in the benchmark, not in the emulator), F5 rerun as B2-F45; base point RTF; static scenes: single-link RTF within a few percent over N = 40-16384, mobility (F3): RTF falls with N; surfaces (must-fix 13, B2 points.csv, one link, N = 240): static 1 MS/s RTF from numBtwoRzeroStaticRtf (R = 0) to numBtwoRfourStaticRtf (R = 4), mobile from numBtwoRzeroMobileRtf to numBtwoRfourMobileRtf, 23.04 MS/s keeps up with up to two surfaces (numBtwoTopRtwoRtf) but not four (numBtwoTopRfourRtf) (checked by bench_results); threads (B2 thread scan, 8 links): numBtwoThrOneRtf with one numba thread, numBtwoThrBestRtf with numBtwoThrBest, numBtwoThrMaxRtf with numBtwoThrMax (gain numBtwoThrGain; numBtwoThrGainSixtyfour at 64 links); static limit 8 links at RTF >= 1 for every N at 1 MS/s; one link keeps up at 23.04 MS/s; feature-set RTFs at one link; peak aggregate throughput with noise (F1; recomputed n_rx f_s RTF; at that point RTF < 1)."
    where: [sections/06_wallclock.tex, sections/app_e_bench.tex]
    evidence: [fig:F7, spec:DESIGN-12.2, pytest:tests/bench/test_bench_zmq_point.py]
    gates: []
  C-WC-ISOLATION:
    text: "Isolation check: the six reference points rerun alone were up to 16 % faster (ratio 0.99-1.16), so packed RTFs are conservative; at 16 links the packed RTF is 0.90-0.94 over N while the base configuration alone (B1) reached 1.07; the limit is 8 links packed and between 8 and 16 alone."
    where: [sections/06_wallclock.tex, sections/app_e_bench.tex]
    evidence: [fig:F7]
    gates: []
  C-WC-DATAPLANE:
    text: "Data plane (MAJOR-11 / journal-later 11, must-fix 15 placeholder filled): B2-F45 (bf08268, another c7i.48xlarge): F5 = native ZMQ data plane to a TX and an RX client process, end-to-end RTF (virtual time delivered to the RX client over wall time from the served engine's warm-up boundary to the client's last sample) of the base point numBtwoFfiveRtf against F4 numBtwoFfiveFfourRtf in the same run; F5/F4 numBtwoFfiveRatioMin-numBtwoFfiveRatioMax over numBtwoFfivePoints twin points; no F5 point at RTF >= 1; all numBtwoFfiveStressRuns stress runs on numBtwoFfiveStressWorkers concurrent workers completed (no stall, no bad packet) at the stated RTF range; starved-client check (RX paused numBtwoFfivePauseS s): end-to-end numBtwoFfivePauseRtf vs client-only numBtwoFfivePauseClientRtf (App. E). E-F latency (regeneration job, bf08268, c7i.48xlarge whose CPUs other work of the job kept up to numEfLatencyBusyMaxPct % busy; lockstep): UHD-shaped API in-process send of 1000 samples p50/p99, native-ZMQ two-process round trip p50/p99, sustained ZMQ rate with 10,000-sample buffers; in-process receive (includes computation) and alternating rate in App. E. All values checked by bench_results (same host type as B2, clean Linux run)."
    where: [sections/06_wallclock.tex, sections/app_e_bench.tex]
    evidence: [fig:F7, test:IO-02, spec:DESIGN-11-E-F, spec:DESIGN-12.2]
    gates: [H-5]
  C-WC-PACED:
    text: "B3 paced (headless = engine-alone upper bound, AWS c7i.8xlarge, bf08268): largest Sustainable configuration per series as generated: 8 links at 1 MS/s with 1024 us pages (worst p99 and miss rate as generated), 4 links with 512 us pages, 2 with 256 us, 8 at 0.1 MS/s (1.28 ms pages), 2 at 5.76 MS/s (356 us pages), a single link at 23.04 MS/s (711 us pages); at 512 us pages four surfaces sustain as many links as one (4) and N = 4096 one link; mobility (F3) has no Sustainable point (one repetition, one link, 512 us pages only)."
    where: [sections/06_wallclock.tex, sections/abstract.tex, sections/app_e_bench.tex]
    evidence: [fig:F8, spec:DESIGN-12.1]
    gates: [H-5]
  C-WC-SHORTPAGES:
    text: "Stopping rule and short pages (must-fix 18): limits are indicative (L doubled until a repetition fails; numBthreeSingleRepEnds of numBthreeSeries series ended on a single repetition, Fig. 3(b) labels the repetitions); the 512 us series ends on computation (8 links: median utilization 0.71, 2.2 % misses), the 256 us and N = 4096 series end in the third repetition of their last point through stalls of 11 ms and 142 ms (cause not identified: no stage breakdown); mobility tried at 512 us pages alone: one link misses 17 % of the deadlines, below the 23 % share of pages that hold a snapshot recomputation (T_u 2.25 ms; such a page takes up to 1.3 ms p99) while the mean load stays below the wall clock; not tried: mobility at other pages or link counts, several surfaces with mobility, paced runs with client processes on the data plane."
    where: [sections/06_wallclock.tex, sections/app_e_bench.tex]
    evidence: [fig:F8]
    gates: [H-5]
  C-WC-LOCKCMD:
    text: "B4 lockstep (bf08268): 22,800 commands at 10 Hz-10 kHz, in process and remote, all lateness values zero; at 10 kHz one command per run switches after the end of the run and stays scheduled (counted as scheduled after the end, not a failure); per-command engine cost from RTF with and without the loop as generated (1.36-1.39 ms at >= 100 Hz), including the page split and the rebuild of link statics; B6 times a configuration change with cached geometry on the laptop (no cross-host ratio; the runs record no stage breakdown, must-fix 18); RTF at 10 kHz none/in-process/remote as generated."
    where: [sections/06_wallclock.tex, sections/app_e_bench.tex]
    evidence: [test:RT-08, pytest:tests/bench/test_bench_b4_checks.py, pytest:tests/bench/test_bench_suites.py::test_b4_lockstep_check_rejects_vacuous_zero_lateness]
    gates: []
  C-WC-PACEDCMD:
    text: "B4 served paced (bf08268, plan served-1ms: 2 links, 1024 us pages, one external command process over the control socket, TX generated and RX kept in the engine): at 10 and 100 commands/s no repetition backlogged (rule: page latency p50 > one page or > 1 % of pages beyond 5 ms slack; checked); asap visible latency median and p99 ranges as generated; timed commands exact in at least numBfourExactOkMinPct % with leads >= 4 ms, late numBfourLateTwoMinPct-numBfourLateTwoMaxPct % with 2 ms (every timed command exact or late, checked); no repetition Sustainable: 1 ms-slack miss rates as generated at both rates (5 ms slack at most as generated) against zero misses headless for the same links and pages (B3; another instance of the same type); at 1000 commands/s engine-bound (achieved rate as generated, every repetition backlogged); conclusion: served controller-in-the-loop operation shown at 10-100 commands/s with leads >= 4 ms on this host but against a looser deadline than the Sustainable rule, called preliminary (must-fix 1). App. E: served engines render small pages serially, idle OpenMP workers sleep (passive), heap frozen; lateness via the virtual margin: per-repetition p1 0.5-1.4 ms with a 2 ms lead (every repetition > 1 % late) and 2.9-3.3 ms with 4 ms (every repetition with a lead >= 4 ms < 1 % late), so a single margin threshold would lie between max p1(2 ms) and min p1(4 ms), of the order of one page plus its computation, stated as an inference (checked in bench_results); late fractions pooled, plus the single-repetition maximum at 4 ms; the largest apply delay (130 ms) is one repetition's page stall of about that length (checked); achieved rates at 1000 commands/s per repetition; client round trip p99 and apply delay as generated; GIL hand-over stated as a hypothesis (must-fix 18); B4-classic (512 us pages, 2 ms lead) gives the same picture, its headless baseline is not marginal."
    where: [sections/06_wallclock.tex, sections/10_conclusion.tex, sections/app_e_bench.tex, sections/abstract.tex]
    evidence: [fig:F8, test:RT-06, spec:DESIGN-4.10]
    gates: [H-5]
  C-WC-COSTMODEL:
    text: "B1 cost model (DESIGN 7.4 form, 20 engine points): indicative, relative RMS 39 %, max 69 %; constant term 65 us = 76 % of the 86 us single-link page; largest errors are mobility underestimates, where a snapshot costs ~0.61 ms + 0.50 ms per link with little RQ dependence at the B1 sizes (8-coefficient diagnostic fit, 12 %, not used for prediction); at the larger N of B2 the snapshot cost grows with N (same snapshot period for N >= 900, F3 RTF still falls); snapshot kernel exponents 1.06 (NumPy, RQ 40 to 1e6) and 0.76 (numba, to 1.7e7). Appendix E only since 2026-10-12."
    where: [sections/app_e_bench.tex]
    evidence: [spec:DESIGN-7.4, spec:DESIGN-12.2]
    gates: []
  C-WC-CROSSTOOL:
    text: "B6 context on the laptop (06cdf7a, clean; not a ranking): same near-field sum, sremu vs MATLAB R2026a agree as generated; per-evaluation times for sremu (new positions, configuration change), vectorized MATLAB, per-element MATLAB loop and phased.RISReflector (different model) as generated; different work per call, one loaded machine, per-call time not the cost of a streaming emulator. Appendix E only since 2026-10-12."
    where: [sections/app_e_bench.tex]
    evidence: [spec:DESIGN-12.2, test:G1]
    gates: []
  C-WC-LIMITS:
    text: "Limitations of Section VI (must-fix 1 envelope): stated hosts, commits and scenes only; one instance per benchmark, 3 repetitions (fewer at the end of some B3 series); packed values conservative by up to 16 %; paced operation measured on Linux only, sustaining (headless) at most 8 links at 0.1-1 MS/s and one link at 23.04 MS/s, headless or with commands over the control socket; no paced run exchanged samples with external applications; paced mode is soft real time; cost model and B6 context in Appendix E."
    where: [sections/06_wallclock.tex, sections/app_e_bench.tex]
    evidence: [spec:DESIGN-12.3]
    gates: []

  # ================================================================ VII Case studies
  # E-B: primary geometry modelled on the lab arrangement (SIM, nominal geometry), AWS run
  # 20261011T060442Z_eb_arc_d41a75 on c7i.16xlarge at sremu 5be649a (clean per the job's
  # SREMU_GIT_COMMIT export; the commit's src/sremu tree hash equals the run's,
  # paper/sweeps/results/E-B-arc/meta.json sremu.commit_verified); lab-like SIM geometry as
  # the supporting row. Every number is a gen_results.py macro read from those results.
  C-EB-WHY:
    text: "Block-coefficient tools cannot place a reconfiguration inside a packet (that GS RIS 008 lists reconfiguration time and modulated-signal quality is stated in Section I since the page fit of 2026-10-12); GR RIS 004 sizes the RIS-controller delay budget by the 5G NR frame structure (cl. 4.4); E-B runs at the sample level in lockstep with an in-process controller (modelled latency) and measures how the two interact; its three lessons (equalizer trained before a mid-packet switch; a long linear transition spreads but does not remove the damage; with a strong LOS QPSK tolerates the wrong configuration) are the E-B1 and E-B2 results below."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [cite:ETSI_GS_RIS008, cite:ETSI_GR_RIS004, test:E-B, test:VA-5, fig:F9]
    gates: []
  C-EB-SETUP:
    text: "E-B setup. Primary geometry modelled on the lab arrangement (SIM, nominal geometry: every distance or angle known only within a range takes the middle of that range; not the measured geometry; no measurement compared): six tiles of 5 x 8 cells on an arc around the Tx acting as one surface, joint exact optimum per receiver over all cells, one command per tile for the same time. Lab-like SIM geometry (one panel of three tiles) as the supporting case. Receiver positions (1.2 m from the Tx at two angles) are an engineering choice [ENG]. Assumptions for both: |Gamma| = 1 (ASSUMED), complex-linear transition [ENG], the LOS-blocking plate removes the LOS only, never a RIS hop, although on the arc it crosses numEbArcBlockerCrossed of the numEbArcBlockerCells Tx->cell segments (recorded by the E-B driver per blocked point; no cell->RX segment), so the blocked results belong to that idealized regime and the LOS-present cases are the physically consistent ones. QPSK packets, one-shot preamble equalizer, Es/N0 at RX1."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [test:E-B, pytest:tests/unit/test_eb_arc.py, fig:F9, spec:DESIGN-11-E-B]
    gates: []
  C-EB-MECH:
    text: "E-B1/VA-5 on both geometries: in every step switch inside a packet the earliest affected sample equals to_ticks(t_sw + tau) and earlier samples are bitwise identical; on the arc each tile's command applies at its own to_ticks(t_sw + tau_tile). Arc, LOS blocked: channel change and rotation as generated, EVM before the switch unchanged, many payload bit errors after a switch at T_p/4 (also with a 200 us linear transition). Arc, LOS present: smaller change, EVM rises, the stated number of bit errors (one in this run)."
    where: [sections/07_case_studies.tex]
    evidence: [test:VA-5, test:RT-05, pytest:tests/runtime/test_eb_arc_va5.py, fig:F9]
    gates: []
  C-EB-TIMING:
    text: "E-B2 on the arc, lockstep with a modelled latency Lambda = 0.2 ms + J U: the whole grid (guards 0.1/0.5/1 ms, five J, timed with three leads, asap, tick-based; lab alphabet LOS present at 25 and 15 dB and blocked at 25 dB; ideal 1-bit LOS present at 25 and 15 dB) was fixed before any point ran (eb_plan.json) and is reported in Table tab:eb2grid; F9b shows the 0.5 ms guard. Timed commands carry a switch time at the guard centre and apply on arrival if late; asap commands apply on arrival, as untimed UHD commands. At the 0.5 ms guard: 0.5 ms lead fails at J = 1 ms (both F9b cases), 5 ms lead loses none at any J; LOS present at 25 dB QPSK tolerates the wrong configuration. gen_results checks the 0.5 ms-guard lead and guard rules on every row of the two F9b cases (the asap guard rule as stated holds at that guard only: at the 0.1 ms guard a switch early in the preamble costs nothing, see C-EB-CLOSED). Conclusion (must-fix 10, 2026-10-12): with the line of sight blocked the PER followed the closed form of the semantics; commands applied on arrival (asap) lost no packet while their worst latency (0.2 ms + J) stayed below the guard plus the preamble (T_pre = numEbTpreMs ms), timed ones below the lead plus half the guard plus T_pre (the conclusion says 'applied on arrival', not 'untimed': tick-based commands carry no time either and lose packets at any latency through the wait for the next tick; every blocked cell with a zero closed form lost nothing, at all three guards: case_tables.eb2_compare; at the 0.1 ms guard asap with J = 0.1 ms has a worst latency of 0.3 ms, above the guard but below guard + T_pre, and lost none); with the line of sight present the waveform sets the cost (C-EB-CLOSED)."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex, sections/10_conclusion.tex]
    evidence: [test:E-B, test:RT-07, fig:F9, table:tab:eb2grid, cite:UHDManual]
    gates: []
  C-EB-TICK:
    text: "Secondary E-B2 semantics, a constructed worst case: a controller that latches commands on its own free-running 2 ms timer, not aligned with the packets (one pending command per panel). A packet is exposed with probability P(Lambda + W > T_g + T_pre), W uniform over one tick period (guard starts visit the tick phases equally often, checked), i.e. 1 - (T_g + T_pre - Lambda_0)/T_t at J = 0 (the stated range over the three guards): set by the timer period against the frame, not by the controller; in both F9b cases it loses the stated range. Published RIS + 5G NR experiments also switch the surface on an uncoordinated timer [Yashvanth 2026, Kiran 2026], but with a period of seconds, so at most one packet per period contains a switch. No lineage remark."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [test:E-B, pytest:tests/runtime/test_eb_arc_va5.py::test_eb2_point_arc_tick_based, fig:F9, cite:Yashvanth2026Random, cite:Kiran2026Random]
    gates: []
  C-EB-CLOSED:
    text: "E-B2 closed form (tools/case_tables.py, exact rational arithmetic): a packet is exposed when the switch that prepares it lands after its preamble (T_pre = 0.256 ms), with probability P(Lambda > T_g + T_pre) for asap and P(Lambda > lead + T_g/2 + T_pre) for timed commands (Lambda = 0.2 ms + J U), and P(Lambda + W > T_g + T_pre) for tick-based ones (W uniform on (0, T_t]; overwrites ignored). LOS blocked (lab, 25 dB): PER follows it (asap J = 1 ms, 0.5 ms guard: 45.6 % measured vs 44.4 %; timed 2 ms lead, J = 3 ms: 23.1 vs 23.1); every asap/timed cell with closed form 0 lost no packet; of the stated number of cells with a positive closed form, the stated number contain it in their Clopper-Pearson interval, none lies below it beyond its interval, and the excess is at most the stated points (largest at the 0.1 ms guard, switches late in the preamble; switches up to 200 us into the preamble cost nothing); tick-based cells exceed theirs by at most the stated points except the cells with overwritten commands (J >= 1 ms), where the PER can fall below it. The asap threshold moves with the guard (J = 1 ms: 88 % at 0.1 ms, none at 1 ms). LOS present: only the stated fraction of exposed packets fail at 15 dB (both alphabets), at most 3.1 % of all packets at 25 dB. Hence the timing rules are designed/closed-form properties of the semantics that the emulator reproduces on IQ samples; the IQ-level finding is the conditional loss. Every statement is checked by gen_results (SystemExit otherwise)."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex, generated/tables/tableF_eb2grid.tex]
    evidence: [test:E-B, fig:F9, table:tab:eb2grid]
    gates: []
  C-EB-SERVED:
    text: "Bridge from E-B's modelled latency to the measured served path (must-fix 1, MAJOR-3): E-B is lockstep with a modelled latency; on the served path (B4) asap commands became visible after a median and p99 as generated, beyond the J <= 1 ms regime of F9; a timed command is exact when its lead covers the delay to the server, the client's virtual-time error and about one page plus its computation (App. E: per-repetition virtual-margin p1 0.5-1.4 ms with 2 ms, 2.9-3.3 ms with 4 ms; the threshold bracket is an inference); late fractions pooled over the repetitions; late fractions: 2 ms lead (the E-B lead) as generated, 4 ms at most numBfourLateFourMaxPct %, 6-12 ms (from about the asap p99 upward) at most numBfourLateSixMaxPct %; so a timed controller on this path needs a lead of 4 ms or more for the on-time regime of F9; the E-B2 grid was not rerun through the served path."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [fig:F8, fig:F9, test:RT-06]
    gates: [H-5]
  C-EB-LABLIKE:
    text: "Supporting lab-like SIM geometry (F9c,d), LOS blocked at 25 dB: channel change and bit errors after the switch; timed commands with a 2 ms lead lose no packet up to J = 1 ms and the stated fraction at J = 3 ms; asap and tick-based losses as generated; LOS present: no packet lost at 25 dB (checked); no 15 dB run in this geometry."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [test:E-B, test:VA-5, fig:F9]
    gates: []
  C-EA-SETUP:
    text: "E-A setup: corridor, 1-D RWP, on-off RIS line, AP 0.5 m off the user line (keeps the LOS power finite on the line), LOS partition acting on the LOS only although it crosses the AP->cell segment of every cell in every partitioned geometry (checked by gen_results on the template geometry), so the gains and tau_half belong to that idealized regime; a partition that also attenuated the RIS hop would leave the A0 values (numEaGainAzero, numEaTauHalfAzero; Appendix F); a single row of cells in a planar geometry; controllers incl. the activation heuristic of the WCL letter (rule as run specified in App. F, C-EA-WCL); evaluated offline (C-EA-EVAL); hypotheses H-A1..H-A3 and their ranges in the emulator's DESIGN.md before the sweep (sremu 2a016a6, the initial push in GitHub's push log, 2026-10-10 16:12:17 UTC; E-A sweep runs 17:47-18:14 UTC, aggregate 18:39 UTC); the plan file with the decision rules and the evaluation rule (SHA-256 of preregistration/E-A.md with LF line ends 5b59f8f2..., computed by gen_results over the LF-normalized text) written before the sweep by the authors' record but committed and pushed to the paper repository only afterwards (commit 71fa3f3, 21:52 UTC per the paper repository's remote-tracking reflog; its blob equals the current E-A.md except that it stores CRLF line ends, raw SHA-256 33dc0c6f...), so no third party dates those parts (Section VII-B says so: hypotheses and ranges fixed before the sweep, decision and evaluation rules committed after it); one disclosed amendment (midpoint rule), made before the full sweep after a 20 s IQ smoke run (exact optimum, tau_SUI 0.1 s) in which the start-of-step rule read +0.095 dB and the midpoint -0.002 dB (E-A.md section 7, values read by gen_results), so VA-1 compares the IQ runs with a rule chosen after an IQ result had been seen: a consistency check of the evaluator, not a blind test. No statement about the original study's corridor or kernel. Gate H-3: the setup names the letter's heuristic."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [test:E-A, test:W2, cite:Mishra2025WCL, fig:F10]
    gates: [H-3]
  C-EA-EVAL:
    text: "E-A points are not computed by the engine's run_batch (one step per interpreter iteration, too slow for the sweep) but by the vectorized evaluator of sremu experiments/ea.py, which evaluates the same narrowband model: channel tabulated on a 1 mm grid (0.5 mm above 1.5 GHz) and interpolated complex-linearly (max |h| error with all cells on, over every geometry at keyed random times: the stated bound, meta.json checks_per_geometry interp_max_db_err_all_on), position-driven controllers' decisions tabulated on their 1 cm GridChannel (equal to the live controllers at the stated number of sampled barriers, 0 mismatches), URAP and bandit run barrier by barrier with the engine's keys, each 5 ms step (split at switch times) evaluated at its midpoint (meta.json assumptions; parsed by gen_results). With the start-of-step rule it matches run_batch within 0.0003 dB in the VA-1 configurations (va1.csv p_vectorized_left_dbm vs p_run_batch_left5ms_dbm; this is the recorded result of check_against_run_batch's comparison). VA-1 coverage: 8 rows = primary geometry at 1 GHz only, exact optimum and URAP (not the heuristic or the bandit), tau_SUI 0.1 and 1 s, noise on/off, mean power over 1000 s only; noise moves the mean by < 1e-6 dB (noise-on rows repeat the noise-off test). One RWP trajectory (seed 20261010) at one speed (1 m/s), shared by all controllers; the RIS is a single row of lambda/4 cells in a planar geometry."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [test:E-A, test:VA-1, fig:F10]
    gates: []
  C-EA-WCL:
    text: "The WCL activation heuristic as run (sremu control/builtin.py WclHeuristic(4, 3), experiments/ea.py; parameters read from E-A.md and checked against the code): base b = h_d + sum_n Z_off,n, d_n = Z_on,n - Z_off,n, delta_n = arg b - arg d_n; cell on iff (delta_n)_2pi < Theta - psi or (-delta_n)_2pi < psi; best of K = L M (M+1)/2 = 24 candidates Theta_l = l pi/(2L), l = 1..L, psi = j Theta/(m+1), 1 <= j <= m <= M (L = 4, M = 3) by |b + sum_{n in A} d_n|^2 on the controller's channel model. The letter fixes K but not the psi values; the grid is the authors' choice (builtin.py module docstring)."
    where: [sections/app_f_cases.tex]
    evidence: [test:E-A, cite:Mishra2025WCL]
    gates: [H-3]
  C-EA-RESULT:
    text: "E-A: optimum gain (mean of per-batch dB) and tau_half with CIs at both carriers; in units of lambda/v the half-lives are the stated constants: the time scale is the classical lambda/v (Doppler) scaling [Clarke 1968, Jakes 1974], consistent with known channel-aging effects on RIS [Papazafeiropoulos 2023, Zhang 2022]; the constant is geometry- and metric-specific (Clarke field/envelope half-correlation times 0.24/0.18 lambda/v; the 0.42 rule of thumb is a geometric mean of 1/f_D and the envelope half time, not a correlation level); the tau ratio lies 3 % above the wavelength ratio 0.417 (corridor fixed in metres); H-A1/H-A2 supported but their pre-set ranges were wide (weak test); the constant is not universal: over the 12 computed geometries (tau_half.csv; Table tab:eageo) tau_half spans 0.27-0.55 lambda/v (0.082-0.163 s at 1 GHz), rising with the partition loss at fixed carrier and offset and falling with the offset h at fixed loss (monotonicity checked by gen_results), 0.35 lambda/v without the partition; Section VII-B gives the no-partition (A0) optimum gain and tau_half at 1 GHz (numEaGainAzero, numEaTauHalfAzero), the values a partition acting on both the LOS and the AP->RIS hop would give, since the A1 gains and tau_half belong to the idealized LOS-only partition (mock review must-fix 6); 0.42 lambda/v is the primary geometry's value; one trajectory at one speed; what E-A adds: the constants for these geometries, the retention metric, the negative bandit/URAP result (H-A3 supported); the WCL heuristic reaches the stated gain at the shortest delay (gate H-3). Abstract and conclusion (must-fix 5, 2026-10-12): the primary geometry's numEaTauOverLambdaV lambda/v together with the range numEaTauLambdaVMin to numEaTauLambdaVMax lambda/v over the computed geometries; the conclusion presents it as the classical Doppler-decorrelation scaling [Clarke 1968, Jakes 1974]: position reports must be younger than a fraction of lambda/v."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex, generated/tables/tableF_eageo.tex, sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [test:E-A, fig:F10, table:tab:eageo, cite:Clarke1968, cite:Jakes1974, cite:Papazafeiropoulos2023Aging, cite:Zhang2022OutdatedCSI]
    gates: [H-3]
  C-VA1:
    text: "VA-1 (consistency check, not a finding): IQ path through the served engine with external controller and RX application agrees with the E-A evaluator (vectorized, midpoint rule) within the stated difference (limit 0.02 dB); coverage: primary geometry at 1 GHz only, exact optimum and URAP at tau_SUI 0.1 and 1 s, mean power only (noise rows: see C-EA-EVAL); the engine's batch path (run_batch, start-of-step rule, 5 ms grid) reads up to the stated amount higher in the same runs and fails the limit (for the exact optimum at 0.1 s only; va1.csv diff_iq_minus_run_batch_db; checked by gen_results/case_tables); with the same start-of-step rule the evaluator matches run_batch within 0.0003 dB, and with all cells on its channel interpolation errs by at most 0.008 dB (C-EA-EVAL; since the page fit of 2026-10-12 these two side results are stated in Appendix F only, and Sec. VII-B points there)."
    where: [sections/07_case_studies.tex]
    evidence: [test:VA-1, fig:F10]
    gates: []
  C-EC:
    text: "E-C ablation (short analytic result, exact optimum, batch path): losses per alphabet and geometry as generated; lab states nearly antipodal (|d|, |m|; magnitudes ASSUMED unit); unequal amplitudes and ideal-design deployment cost more (conclusion: designing for the laboratory states recovers up to the stated penalty, numEcDesignPenaltyMaxDb for an ideal design deployed on the lab states, in the geometries studied)."
    where: [sections/07_case_studies.tex, generated/tables/table8_ablation.tex, sections/10_conclusion.tex, sections/app_f_cases.tex]
    evidence: [test:PH-24, test:PH-25, test:PH-29, fig:F11, table:tab:ablation, cite:WuZhang2020Discrete, cite:Abeywickrama2020Practical]
    gates: []
  C-ED:
    text: "E-D (model-based dimensioning, not validated): required aperture range; RIS-minus-direct gap at grazing over every distance and height of F12; the 56.25 m^2 panel suffices in none of the primary map entries; the four-ray sensitivity and the experimental P.526 direct path change the count."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [test:PH-10, test:PH-11, test:V-FM, fig:F12]
    gates: []
  C-EE:
    text: "External-process runs: V-CFO-3 (two processes, native ZMQ), VA-1 (external controller and RX app) and E-E: unmodified GNU Radio 3.10.9.2 (Ubuntu package; stock gr-zeromq REQ/REP blocks and a DQPSK modem built from stock blocks, separate process) as the raw REQ/REP peer through a SIM RIS scene (the raw request-reply data plane, not the UHD-shaped API). Since 2026-10-12 the abstract no longer names GNU Radio (length; open issue of part 2a)."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [test:V-CFO-3, test:IO-02, test:IO-08, pytest:tests/integration/test_gnuradio_raw.py]
    gates: []
  C-EE-LINK:
    text: "E-E static sweep (one fresh run and modem per RIS configuration): no symbol error with focusing; SER and uncoded 200-bit block error rate (windows of the decision stream, no coding/CRC) do not decrease as the configuration gain falls; random loses every block; gains relative to focusing within the stated dB of an isotropic array-factor prediction (internal consistency check, not a measurement); implementation loss vs coherent DQPSK theory quoted only for rows with >= 100 symbol errors and the link up, larger once the link is lost. gen_results checks each statement against sweeps/results/E-E."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [table:tab:ee, pytest:tests/integration/test_gnuradio_raw.py, pytest:tests/integration/test_gnuradio_analysis.py]
    gates: []
  C-EE-TIMING:
    text: "E-E switching run: three RIS switches scheduled over the control socket before virtual time started, applied with zero lateness; ML change point of the IQ GNU Radio received at k_applied (offset 0) for each; every run: GNU Radio received every sample, bitwise equal to the emulator's own RX record, all counters zero; two independent repetitions of all runs bitwise identical (sha256 of received IQ and decisions)."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [pytest:tests/integration/test_gnuradio_raw.py::test_gnuradio_dqpsk_switching_run_through_raw_mode, pytest:tests/integration/test_gnuradio_raw.py::test_gnuradio_static_runs_are_bitwise_reproducible, pytest:tests/io/test_io08_raw_exit_when_done.py, test:IO-03]
    gates: []
  C-EE-SPEED:
    text: "E-E runs are lockstep (virtual time; the sample exchange paces the emulator); lockstep RTF range of the GNU Radio + sremu loop over every laptop sweep of single runs in the result files (three dedicated sweeps plus the throughput runs of the E-E result run while E-E comes from the laptop; CPU named, WSL2, host load not controlled) at 1 MS/s and at the highest rate run (5.76 MS/s); AWS value pending the pinned regeneration (placeholder)."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
    evidence: [spec:DESIGN-11-E-E, spec:DESIGN-12.1, pytest:tests/integration/test_gnuradio_raw.py]
    gates: []
  C-EE-NOTRUN:
    text: "srsRAN and OpenAirInterface analysed, not run: srsRAN 4G pads TX only to the end of the RX block it reads, lockstep needs TX one FD look-ahead ahead, so a lockstep srsRAN pair stalls without a per-peer TX delay >= look-ahead and partial RX replies; srsRAN 4G not packaged for Ubuntu 24.04; OAI rfsimulator uses its own TCP framing (new transport). Future work."
    where: [sections/07_case_studies.tex, sections/app_f_cases.tex]
