  # ================================================================ VI Wall-clock behaviour
  # Benchmarks B1-B4 (AWS, sremu 309c633) and B6 (laptop), copied with provenance in
  # paper/sweeps/results/bench; every number is a bench_results.py macro (MEAS). Analysis and
  # the two corrections (B2 aggregate recomputed; B4 lockstep check recomputed offline) are in
  # research/analysis/bench_findings.md. F5 (native ZMQ) is pending a rerun: placeholder only.
  C-WC-DEFS:
    text: "Definitions as in DESIGN 12.1: lockstep vs paced (release R_j); RTF = min over received streams of samples/f_s per wall second; aggregate throughput = received samples summed over streams per wall second; page latency = delivery - R_j; miss at slack s when latency > s, so the miss rate is the latency CCDF and zero slack is missed by construction (computation starts at R_j); Sustainable = >= 60 s after a 5 s warm-up, miss rate < 1e-3 at 1 ms slack, no late input samples, no overflowing pages; visible latency and lateness of commands."
    where: [sections/06_wallclock.tex]
    evidence: [spec:DESIGN-12.1, spec:DESIGN-4.10, test:RT-18]
    gates: []
  C-WC-HOSTS:
    text: "Hosts and protocol: B1/B2 on an AWS c7i.48xlarge, B3/B4 on AWS c7i.8xlarge with the engine pinned to 16 logical CPUs and nothing else running, B6 on the laptop; B1-B4 at one emulator commit (309c633), B3/B4 from a clean tree, B1/B2 with a recorded dirty flag although their uploaded bundle is byte-identical to the commit's tree (bench meta.json dirty_note; provenance table); B2 packed 11 points of 16 logical CPUs; paced points ran 3 repetitions of 60 s (>= 46,876 pages each) and count as Sustainable only when every repetition is; B3 is headless; benchmark scenes carry no physical result (Table VII); a link is a TX-RX pair (L = n_tx n_rx; 8 links = 2 TX x 4 RX)."
    where: [sections/06_wallclock.tex, generated/tables/table7_platforms.tex]
    evidence: [table:tab:platforms, table:tab:provenance, spec:DESIGN-12.3]
    gates: []
  C-WC-LOCKSTEP:
    text: "B2 lockstep (packed): points planned/run/ok/below floor/failed as generated, every failure an F5 (native ZMQ) point: three receive time-outs from a benchmark configuration error (served run shorter than the clients' streams) and one benchmark error below the floor, both fixed in the benchmark (sremu 60d0e6d), not in the emulator; F5 excluded and its base-point RTF from the rerun at the pinned commit (placeholder until then); base point RTF; static scenes: single-link RTF within a few percent over N = 40-16384, mobility (F3): RTF falls with N; static limit 8 links at RTF >= 1 for every N at 1 MS/s; a single link keeps up at 23.04 MS/s; feature-set RTFs at one link; peak aggregate throughput with noise (F1; recomputed n_rx f_s RTF; at that point RTF < 1)."
    where: [sections/06_wallclock.tex]
    evidence: [fig:F7, spec:DESIGN-12.2, pytest:tests/bench/test_bench_zmq_point.py]
    gates: []
  C-WC-ISOLATION:
    text: "Isolation check: the six reference points rerun alone were up to 16 % faster (ratio 0.99-1.16), so packed RTFs are conservative; at 16 links the packed RTF is 0.90-0.94 over N while the base configuration alone (B1) reached 1.07; the limit is 8 links packed and between 8 and 16 alone."
    where: [sections/06_wallclock.tex]
    evidence: [fig:F7]
    gates: []
  C-WC-PACED:
    text: "B3 paced (headless, AWS c7i.8xlarge): largest Sustainable configuration per series as generated (8 links at 1 MS/s with 1.024 ms pages, worst p99 and miss rate as generated; one link at 0.512 ms pages; 2 links at 0.256 ms pages; a single link at 23.04 MS/s; 2 links at 5.76 MS/s (0.356 ms pages); at 0.512 ms pages 4 links with four surfaces, more than with one, and one link at N = 4096)."
    where: [sections/06_wallclock.tex, sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [fig:F8, spec:DESIGN-12.1]
    gates: [H-5]
  C-WC-SHORTPAGES:
    text: "Short pages: the two-link 0.512 ms point failed in one of three repetitions through a few stalls of up to 11 ms although its median utilization is 0.27; mobility (F3) misses the deadline on the pages that hold a snapshot recomputation (miss rate equal to the snapshot-page share P/(f_s T_u)); at 0.1 MS/s 58 pages above 1 ms (1-4 ms) fail the threshold in the single repetition, not explained by per-page cost or timers (the engine spins before releases closer than 1.5 ms); cause not identified."
    where: [sections/06_wallclock.tex]
    evidence: [fig:F8]
    gates: [H-5]
  C-WC-LOCKCMD:
    text: "B4 lockstep: 22,800 commands at 10 Hz-10 kHz, in process and remote, all lateness values zero; at 10 kHz one command per run switches after the end of the run and stays scheduled (benign); the original check counted it, the corrected check recomputed offline passes; per-command engine cost 1.25-1.49 ms from RTF with and without the loop; RTF at 10 kHz none/in-process/remote as generated."
    where: [sections/06_wallclock.tex]
    evidence: [test:RT-08, pytest:tests/bench/test_bench_b4_checks.py, pytest:tests/bench/test_bench_suites.py::test_b4_lockstep_check_rejects_vacuous_zero_lateness]
    gates: []
  C-WC-PACEDCMD:
    text: "B4 paced, served over the control socket: no repetition Sustainable; 1 ms-slack miss rates at 10 and 100 commands/s as generated vs at most ~1e-3 headless (B3, same links and pages); asap visible latency median and p99 as generated; the paced schedule adds at most one page; the floor is the engine work on the page with a configuration change; the spread is consistent with the GIL hand-over between the control thread and the paced loop (most of the latency from the implementation: configuration change and serving thread, not the paced schedule; rare outliers up to 76 ms); B3 comparison is across two instances of the same type; timed commands with a 2 ms lead below the command latency were late and applied on arrival (rule: lead > latency + clock-estimate error); >= 1 kHz engine-bound (achieved rate; page latencies up to 29 s; a repetition up to 18 % longer than its virtual time since the engine catches up after the client stops; timed-command backlog)."
    where: [sections/06_wallclock.tex, sections/10_conclusion.tex]
    evidence: [fig:F8, test:RT-06, spec:DESIGN-4.10]
    gates: [H-5]
  C-WC-COSTMODEL:
    text: "B1 cost model (DESIGN 7.4 form, 20 engine points): indicative, relative RMS 39 %, max 69 %; constant term 65 us = 76 % of the 86 us single-link page; largest errors are mobility underestimates, where a snapshot costs ~0.61 ms + 0.50 ms per link with little RQ dependence at the B1 sizes (8-coefficient diagnostic fit, 12 %, not used for prediction); at the larger N of B2 the snapshot cost grows with N (same snapshot period for N >= 900, F3 RTF still falls); snapshot kernel exponents 1.06 (NumPy, RQ 40 to 1e6) and 0.76 (numba, to 1.7e7)."
    where: [sections/06_wallclock.tex]
    evidence: [spec:DESIGN-7.4, spec:DESIGN-12.2]
    gates: []
  C-WC-CROSSTOOL:
    text: "B6 context on the laptop (not a ranking): same near-field sum, sremu vs MATLAB R2026a agree to 7.8e-14 dB; per-evaluation times for sremu (new positions, configuration change), vectorized MATLAB, per-element MATLAB loop and phased.RISReflector (different model) as generated; different work per call, one loaded machine, per-call time not the cost of a streaming emulator."
    where: [sections/06_wallclock.tex]
    evidence: [spec:DESIGN-12.2, test:G1]
    gates: []
  C-WC-LIMITS:
    text: "Limitations of Section VI: stated hosts, commit and scenes only; one instance per benchmark, 3 repetitions; paced timing headless or with the control socket alone; F5 pending; packed values conservative by up to 16 %; indicative cost model; B6 laptop not idle; paced mode is soft real time."
    where: [sections/06_wallclock.tex]
    evidence: [spec:DESIGN-12.3]
    gates: []

  # ================================================================ VII Case studies
  # E-B: primary geometry modelled on the lab arrangement (SIM, nominal geometry), AWS run
  # 20261011T060442Z_eb_arc_d41a75 on c7i.16xlarge at sremu 5be649a (clean per the job's
  # SREMU_GIT_COMMIT export; the commit's src/sremu tree hash equals the run's,
  # paper/sweeps/results/E-B-arc/meta.json sremu.commit_verified); lab-like SIM geometry as
  # the supporting row. Every number is a gen_results.py macro read from those results.
  C-EB-WHY:
    text: "Block-coefficient tools cannot place a reconfiguration inside a packet; GS RIS 008 lists reconfiguration time and modulated-signal quality; GR RIS 004 sizes the RIS-controller delay budget by the 5G NR frame structure (cl. 4.4); E-B runs at the sample level in lockstep with an in-process controller (modelled latency) and measures how the two interact; its three lessons (equalizer trained before a mid-packet switch; a long linear transition spreads but does not remove the damage; with a strong LOS QPSK tolerates the wrong configuration) are the E-B1 and E-B2 results below."
    where: [sections/07_case_studies.tex]
    evidence: [cite:ETSI_GS_RIS008, cite:ETSI_GR_RIS004, test:E-B, test:VA-5, fig:F9]
    gates: []
  C-EB-SETUP:
    text: "E-B setup. Primary geometry modelled on the lab arrangement (SIM, nominal geometry: every distance or angle known only within a range takes the middle of that range; not the measured geometry; no measurement compared): six tiles of 5 x 8 cells on an arc around the Tx acting as one surface, joint exact optimum per receiver over all cells, one command per tile for the same time. Lab-like SIM geometry (one panel of three tiles) as the supporting case. Receiver positions (1.2 m from the Tx at two angles) are an engineering choice [ENG]. Assumptions for both: |Gamma| = 1 (ASSUMED), complex-linear transition [ENG], the LOS-blocked occluder removes the LOS only (idealized on the arc, where a real plate would also shadow RIS rays). QPSK packets, one-shot preamble equalizer, Es/N0 at RX1."
    where: [sections/07_case_studies.tex]
    evidence: [test:E-B, pytest:tests/unit/test_eb_arc.py, fig:F9, spec:DESIGN-11-E-B]
    gates: []
  C-EB-MECH:
    text: "E-B1/VA-5 on both geometries: in every step switch inside a packet the earliest affected sample equals to_ticks(t_sw + tau) and earlier samples are bitwise identical; on the arc each tile's command applies at its own to_ticks(t_sw + tau_tile). Arc, LOS blocked: channel change and rotation as generated, EVM before the switch unchanged, many payload bit errors after a switch at T_p/4 (also with a 200 us linear transition). Arc, LOS present: smaller change, EVM rises, the stated number of bit errors (one in this run)."
    where: [sections/07_case_studies.tex]
    evidence: [test:VA-5, test:RT-05, pytest:tests/runtime/test_eb_arc_va5.py, fig:F9]
    gates: []
  C-EB-TIMING:
    text: "E-B2 on the arc, 0.5 ms guard, cases fixed before the run (eb_plan.json), lockstep with a modelled latency of 0.2 ms + U[0, J]: LOS present at Es/N0 25 dB: no semantics loses more than the stated (small) fraction. LOS present at the pre-declared 15 dB sensitivity and LOS blocked at 25 dB (F9b): asap commands (applied on arrival, as untimed UHD commands) lose none while the worst latency fits in the guard and the stated fractions at J = 1 ms; timed commands lose no packet while the lead exceeds the worst latency (2 ms lead: none up to J = 1 ms, losses at J = 3 ms; 0.5 ms lead: losses at J = 1 ms; 5 ms lead: none at any J); late timed commands apply on arrival. These two rules are the designed behaviour of the command semantics, verified on IQ samples, not a finding; the experiment adds the cost of a mistimed switch and how fast the loss grows. gen_results checks the lead and guard rules on every row of the two cases. Conclusion: untimed commands lost packets whenever the worst latency exceeded the guard."
    where: [sections/07_case_studies.tex, sections/10_conclusion.tex]
    evidence: [test:E-B, test:RT-07, fig:F9, cite:UHDManual]
    gates: []
  C-EB-TICK:
    text: "Secondary E-B2 semantics (MAJOR-3): a controller that latches commands on its own free-running 2 ms timer, not aligned with the packets (one pending command per panel); published RIS + 5G NR experiments switch the surface on such a timer without coordination with the base station [Yashvanth 2026, Kiran 2026]; analogy in the effect (switch at an arbitrary point of a packet), periods of seconds there vs of the order of a packet here; in both F9b cases it loses the stated range at every jitter, also without jitter. No lineage remark."
    where: [sections/07_case_studies.tex]
    evidence: [test:E-B, pytest:tests/runtime/test_eb_arc_va5.py::test_eb2_point_arc_tick_based, fig:F9, cite:Yashvanth2026Random, cite:Kiran2026Random]
    gates: []
  C-EB-SERVED:
    text: "Bridge to the served path (MAJOR-3): E-B is lockstep with a modelled latency; over the served control socket in paced mode (B4) the visible asap latency has the stated median and p99 ranges and rare outliers, and with the 2 ms lead used there the stated per-repetition fraction of timed commands was late at 10 commands/s; a timed command there is on time when its lead exceeds the command latency plus the client's virtual-time error (the rule of Section VI; no computed needed-lead macro, R2-F2; the earlier 'p99 + one page' rule was dropped because B4 repetition 2 at 10 commands/s had 1.2 % late with a 2 ms lead, below its 5.6 ms asap p99); the J <= 1 ms regime of F9 is not yet reachable through the served path. Numbers are B4 macros and change with the transport rerun."
    where: [sections/07_case_studies.tex]
    evidence: [fig:F8, fig:F9, test:RT-06]
    gates: [H-5]
  C-EB-LABLIKE:
    text: "Supporting lab-like SIM geometry (F9c,d), LOS blocked at 25 dB: channel change and bit errors after the switch; timed commands with a 2 ms lead lose no packet up to J = 1 ms and the stated fraction at J = 3 ms; asap and tick-based losses as generated; LOS present: no packet lost at 25 dB (checked); no 15 dB run in this geometry."
    where: [sections/07_case_studies.tex]
    evidence: [test:E-B, test:VA-5, fig:F9]
    gates: []
  C-EA-SETUP:
    text: "E-A setup: corridor, 1-D RWP, on-off RIS line, AP 0.5 m off the user line (keeps the LOS power finite on the line), LOS partition; controllers incl. our reading of the WCL heuristic; batch path; hypotheses H-A1..H-A3 and their ranges in the emulator's DESIGN.md before the sweep (sremu 2a016a6, the initial push in GitHub's push log, 2026-10-10 16:12:17 UTC; E-A sweep runs 17:47-18:14 UTC, aggregate 18:39 UTC); the plan file with the decision rules and the evaluation rule (SHA-256 of preregistration/E-A.md with LF line ends 5b59f8f2..., computed by gen_results over the LF-normalized text) written before the sweep by the authors' record but committed and pushed to the paper repository only afterwards (commit 71fa3f3, 21:52 UTC per the paper repository's remote-tracking reflog; its blob equals the current E-A.md except that it stores CRLF line ends, raw SHA-256 33dc0c6f...), so no third party dates those parts; one disclosed amendment (midpoint rule), made after a short IQ smoke run in which the start-of-step rule read +0.095 dB (E-A.md section 7). No statement about the original study's corridor or kernel. Gate H-3: the setup names our reading of the letter's heuristic."
    where: [sections/07_case_studies.tex]
    evidence: [test:E-A, test:W2, cite:Mishra2025WCL, fig:F10]
    gates: [H-3]
  C-EA-RESULT:
    text: "E-A: optimum gain (mean of per-batch dB) and tau_half with CIs at both carriers; in units of lambda/v the half-lives are the stated constants: the time scale is the classical lambda/v (Doppler) scaling [Clarke 1968, Jakes 1974], consistent with known channel-aging effects on RIS [Papazafeiropoulos 2023, Zhang 2022]; the constant is geometry- and metric-specific (Clarke field/envelope half-correlation times 0.24/0.18 lambda/v; the 0.42 rule of thumb is a geometric mean of 1/f_D and the envelope half time, not a correlation level); the tau ratio lies 3 % above the wavelength ratio 0.417 (corridor fixed in metres); H-A1/H-A2 supported but their pre-set ranges were wide (weak test); what E-A adds: the constant, the retention metric, the negative bandit/URAP result (H-A3 supported); our reading of the WCL heuristic reaches the stated gain at the shortest delay (gate H-3). Conclusion: reports younger than a fraction of lambda/v."
    where: [sections/07_case_studies.tex, sections/abstract.tex, sections/10_conclusion.tex]
    evidence: [test:E-A, fig:F10, cite:Clarke1968, cite:Jakes1974, cite:Papazafeiropoulos2023Aging, cite:Zhang2022OutdatedCSI]
    gates: [H-3]
  C-VA1:
    text: "VA-1 (consistency check, not a finding): IQ path through the served engine with external controller and RX application agrees with the batch evaluation of E-A (vectorized, midpoint rule) within the stated difference (limit 0.02 dB); the engine's batch path (run_batch, start-of-step rule, 5 ms grid) reads up to the stated amount higher in the same runs (va1.csv diff_iq_minus_run_batch_db, checked by gen_results)."
    where: [sections/07_case_studies.tex]
    evidence: [test:VA-1, fig:F10]
    gates: []
  C-EC:
    text: "E-C ablation (short analytic result, exact optimum, batch path): losses per alphabet and geometry as generated; lab states nearly antipodal (|d|, |m|; magnitudes ASSUMED unit); unequal amplitudes and ideal-design deployment cost more (conclusion: designing for the true states recovers up to the stated penalty in the geometries studied)."
    where: [sections/07_case_studies.tex, generated/tables/table8_ablation.tex, sections/10_conclusion.tex]
    evidence: [test:PH-24, test:PH-25, test:PH-29, fig:F11, table:tab:ablation, cite:WuZhang2020Discrete, cite:Abeywickrama2020Practical]
    gates: []
  C-ED:
    text: "E-D (model-based dimensioning, not validated): required aperture range; RIS-minus-direct gap at grazing over every distance and height of F12; the 56.25 m^2 panel suffices in none of the primary map entries; the four-ray sensitivity and the experimental P.526 direct path change the count."
    where: [sections/07_case_studies.tex]
    evidence: [test:PH-10, test:PH-11, test:V-FM, fig:F12]
    gates: []
  C-EE:
    text: "External-process runs: V-CFO-3 (two processes, native ZMQ), VA-1 (external controller and RX app) and E-E: unmodified GNU Radio 3.10.9.2 (Ubuntu package; stock gr-zeromq REQ/REP blocks and a DQPSK modem built from stock blocks, separate process) as the raw REQ/REP peer through a SIM RIS scene."
    where: [sections/07_case_studies.tex]
    evidence: [test:V-CFO-3, test:IO-02, test:IO-08, pytest:tests/integration/test_gnuradio_raw.py]
    gates: []
  C-EE-LINK:
    text: "E-E static sweep (one fresh run and modem per RIS configuration): no symbol error with focusing; SER and uncoded 200-bit block error rate (windows of the decision stream, no coding/CRC) do not decrease as the configuration gain falls; random loses every block; gains relative to focusing within the stated dB of an isotropic array-factor prediction (internal consistency check, not a measurement); implementation loss vs coherent DQPSK theory quoted only for rows with >= 100 symbol errors and the link up, larger once the link is lost. gen_results checks each statement against sweeps/results/E-E."
    where: [sections/07_case_studies.tex]
    evidence: [table:tab:ee, pytest:tests/integration/test_gnuradio_raw.py, pytest:tests/integration/test_gnuradio_analysis.py]
    gates: []
  C-EE-TIMING:
    text: "E-E switching run: three RIS switches scheduled over the control socket before virtual time started, applied with zero lateness; ML change point of the IQ GNU Radio received at k_applied (offset 0) for each; every run: GNU Radio received every sample, bitwise equal to the emulator's own RX record, all counters zero; two independent repetitions of all runs bitwise identical (sha256 of received IQ and decisions)."
    where: [sections/07_case_studies.tex]
    evidence: [pytest:tests/integration/test_gnuradio_raw.py::test_gnuradio_dqpsk_switching_run_through_raw_mode, pytest:tests/integration/test_gnuradio_raw.py::test_gnuradio_static_runs_are_bitwise_reproducible, pytest:tests/io/test_io08_raw_exit_when_done.py, test:IO-03]
    gates: []
  C-EE-SPEED:
    text: "E-E runs are lockstep (virtual time; the sample exchange paces the emulator); lockstep RTF range of the GNU Radio + sremu loop over every laptop sweep of single runs in the result files (three dedicated sweeps plus the throughput runs of the E-E result run while E-E comes from the laptop; CPU named, WSL2, host load not controlled) at 1 MS/s and at the highest rate run (5.76 MS/s); AWS value pending the pinned regeneration (placeholder)."
    where: [sections/07_case_studies.tex]
    evidence: [spec:DESIGN-11-E-E, spec:DESIGN-12.1, pytest:tests/integration/test_gnuradio_raw.py]
    gates: []
  C-EE-NOTRUN:
    text: "srsRAN and OpenAirInterface analysed, not run: srsRAN 4G pads TX only to the end of the RX block it reads, lockstep needs TX one FD look-ahead ahead, so a lockstep srsRAN pair stalls without a per-peer TX delay >= look-ahead and partial RX replies; srsRAN 4G not packaged for Ubuntu 24.04; OAI rfsimulator uses its own TCP framing (new transport). Future work."
    where: [sections/07_case_studies.tex]
    evidence: [cite:OAIrfsim, cite:srsRANZMQ, spec:DESIGN-8.4]
    gates: []
