# claims.yaml -- every capability or result claim in the paper, mapped to its evidence
# (DESIGN 1.6 and 13.6, minimal version). tools/check_claims.py enforces it.
#
# Fields
#   text      the claim in one sentence (what the paper asserts)
#   where     files that state it (a \claim{ID} marker there is optional)
#   evidence  list of  test:<spec id>   passes in the pinned junit (PH, RT, IO, ST, G, W, VA, V-*)
#                      pytest:<tests/...py>[::<test>]
#                                       sremu tests without a spec id (e.g. RisEnv); passes in the
#                                       pinned junit; the file must exist in the sremu checkout
#                      fig:<F1..F12>    figure registered and generated (meta + PDF present)
#                      cite:<bib key>   entry exists in refs.bib
#                      table:<label>    LaTeX label exists (e.g. tab:tools)
#                      spec:<section>   design-spec reference (informational, always satisfied)
#   gates     human gates (human_gates.yaml) that must be closed
#   banned_word_uses
#             optional list of {word, context}: allows a banned word (DESIGN 1.6 rule 5) or an
#             unqualified "real-time" in the text unit containing `context`, under this claim
#
# A claim is "supported" when every test passes, every figure exists and every gate is
# closed; otherwise it is "pending". Draft builds report pending claims; final builds refuse.
#
# Sections III, IV, VIII-X and the appendix (WP12, stage C) describe sremu commit 2a016a6;
# each capability claim there names the tests that exercise it. Module paths are in the TeX
# comments next to the claims. Sections V and VII (WP12 stage C draft) describe the committed
# study and experiment results; their numbers come from tools/gen_results.py.
# The paper presents sremu as a new emulator: no claim compares it with an earlier simulator;
# the single transparency sentence is C-LINEAGE.

claims:
  # ================================================================ abstract, I, II
  C-GAP:
    text: "As of 10 Oct 2026, no surveyed tool, open or not, combines (i) IQ-level multi-node emulation behind an SDR-style interface, (ii) runtime external RIS commands applied at an explicit logged sample, (iii) imported measured per-state responses (state, frequency, and incidence and reflection angle in one plane of incidence; must-fix 8), and (iv) characterized wall-clock behaviour; sremu itself is not open yet (Table I Open column: 'Not yet (on request)'; release conditional, Code and Data Availability)."
    where: [sections/01_introduction.tex, sections/02_related_work.tex, sections/app_a_survey.tex]
    evidence:
      - table:tab:tools
      - cite:Gurses2026ACHEM
      - cite:ElGhalbzouri2025GoSimRIS
      - cite:Kayraklik2026ORIX
      - cite:Burtakov2023QRIS
      - cite:Tsampazi2025RISColosseum
      - cite:OAIrfsim
      - cite:srsRANZMQ
      - cite:SionnaRTReleases
      - test:RT-05
      - test:IO-02
      - test:IO-03
      - test:PH-31
      - fig:F7
      - fig:F8
    gates: []
  C-OPEN:
    text: "Code and data availability (conditional, availability.yaml status: conditional): sremu, the paper pipeline and the authors' data files will be released under an open-source licence once all authors and IIT Bhilai approve; until then available from the corresponding author on request. The statement prints no licence, repository URL or DOI, so it is complete without them (no placeholder); those availability.yaml macros are used only after status: released, when every field must be filled. The words 'Open'/'open-source' are not in the title or the abstract (title T1, author decision 2026-10-11)."
    where: [sections/back_matter.tex]
    evidence: [spec:DESIGN-2.1]
    gates: [H-2]
  C-SOFTWARE-ONLY:
    text: "sremu is software-only: it needs no radio hardware; external applications exchange samples with it over sockets or in process (DESIGN 1.1)."
    where: [sections/abstract.tex, sections/01_introduction.tex]
    evidence: [test:IO-02, test:IO-07, spec:DESIGN-1.1]
    gates: []
    banned_word_uses:
      - {word: only, context: "software-only emulator"}
  C-MODELCARD:
    text: "Table II (generated from sremu docs/model_card.yaml): model, validity domain, evidence and default per component, including 'statistical background only' for diffuse fading and 'coupling via tables only'."
    where: [generated/tables/table2_model_card.tex, sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-01, test:PH-02, test:PH-04, test:PH-26, test:PH-28, test:PH-31, test:PH-10, test:PH-32, test:PH-08, test:PH-11, test:ST-02, test:G6, test:PH-17, test:PH-18, test:PH-19, test:PH-20, test:PH-21, test:G5, test:PH-13, test:PH-15, test:RT-12, table:tab:modelcard]
    gates: []
    banned_word_uses:
      - {word: only, context: "Statistical background only"}
      - {word: only, context: "coupling via tables only"}
  C-TIMED-CMD:
    text: "A RIS command for switch time t_sw takes effect on receiver r (render tile j) at k = to_ticks(t_sw + tau_{r,j}(t_sw), f_r), with tau evaluated in the geometry at t_sw; requested and applied samples are logged."
    where: [sections/01_introduction.tex, sections/abstract.tex, sections/03_design.tex, sections/10_conclusion.tex]
    evidence: [test:RT-05, test:RT-06, test:RT-07, test:IO-03, fig:F2]
    gates: []
  C-LOCKSTEP-EXACT:
    text: "Lockstep runs are sample-exact and deterministic, including with controllers in the loop, in process (E-B, modelled latency) and over the control socket in barrier mode (VA-1; B4 lockstep, 22,800 commands with zero lateness); RX samples are bitwise identical under client chunking, event/barrier cuts and across process boundaries. Conclusion (must-fix 1; scoped to barrier controllers as Sec. III C-LOCKSTEP states, adversarial review 2026-10-12): 'lockstep runs with barrier controllers, in process or over the control socket, are deterministic'. Paced operation is not claimed deterministic."
    where: [sections/10_conclusion.tex]
    evidence: [test:RT-03, test:RT-08, test:RT-16, test:IO-02]
    gates: []
  C-CONTRIB-1:
    text: "Timed RIS control in an IQ-level emulator: per-receiver application, one physical switch time for late commands, command log, deterministic barriers in lockstep (in process and over the control socket; must-fix 1 scoping), a paced mode that measures its own timing, UHD-shaped API, framed ZMQ data plane, GS RIS 008-aligned table schema."
    where: [sections/01_introduction.tex]
    evidence: [test:RT-05, test:RT-06, test:RT-08, test:RT-18, test:IO-02, test:IO-03, test:IO-05, fig:F1, fig:F2, cite:ETSI_GS_RIS008]
    gates: []
  C-CONTRIB-2:
    text: "A verified physical model with stated validity limits: the area-tied aperture kernel (equal to three published forms; physical optics in the strict sense only with the Kirchhoff obliquity, Appendix C), cell model, model card, an import path for per-state tables that is tested but not used here with a measured table (reported and assumed states only; Table I), CI oracle count, MATLAB code-to-code, agreement of the model class with Tang's third-party chamber measurements, inherited from the published path-loss model that the emulator reproduces (K1 equals it for one point per cell; the curves are an implementation check; not a test of switching or timing), a consistency check against a laboratory measurement collected by the authors under a pre-specified plan hash-locked before unblinding (null result and measurement-design lesson), CFO and BER checks against the CRB and theory. Listed second, in section order (Sections IV-V)."
    where: [sections/01_introduction.tex]
    evidence: [test:PH-02, test:PH-04, test:PH-26, test:G1, test:G2, test:G3, test:V-TANG-1, test:V-LAB, test:V-CFO-1, test:ST-04, test:ST-05, fig:F3, fig:F4, fig:F5, cite:Tang2022mmWave]
    gates: []
  C-CONTRIB-3:
    text: "Characterized wall-clock behaviour: definitions (lockstep, paced, headless = streams generated and consumed in the emulator process without client processes, transport or control socket, served), RTF, deadline misses, latency percentiles; scaling over links, elements, surfaces (B2 R = 0/1/2/4 scan, must-fix 13), numba threads (B2 thread scan), rates and feature sets including the native ZMQ data plane end to end (B2-F45) on AWS Linux servers; headless paced limits (B3); and, for an external controller served over the control socket (B4), command latency and the exact-sample fraction of timed commands, whose page-deadline miss rates fail the Sustainable rule (must-fix 1: the served outcome stated next to the headless one). The laptop contributes the B6 cross-tool context, no scaling run. The fitted cost model is not a contribution (MINOR-10)."
    where: [sections/01_introduction.tex]
    evidence: [test:RT-18, fig:F7, fig:F8]
    gates: [H-5]
  C-CONTRIB-4:
    text: "Case studies of timed control: at the sample level, in lockstep with an in-process controller and a modelled latency, intra-frame reconfiguration and timed vs asap vs timer-latched commands (E-B); on channel coefficients (for E-A an offline vectorized evaluator, not the engine's run_batch, that agrees with the VA-1 sample-level runs within the VA-1 tolerance, stated as 'agrees with the sample-level VA-1 runs' (one geometry, two controllers, two delays; must-fix 4); E-C static coefficients), the signaling-delay time scale in a blocked corridor (E-A) and a non-ideality ablation (E-C). The FM dimensioning (E-D) is not a contribution (mock review should-fix 7; Section VII and Appendix F keep it)."
    where: [sections/01_introduction.tex]
    evidence: [test:VA-5, test:VA-1, test:E-B, fig:F9, fig:F10, fig:F11]
    gates: []
  C-SCOPE:
    text: "Scope box: not a UHD drop-in, not hard real time, not a ray tracer, no model of mutual coupling (per-state tables hold coupling only for identical neighbours, the locally periodic model of GR RIS 003), scalar co-polar, single-bounce RIS paths, order-1 walls; paced timing measured per platform."
    where: [sections/01_introduction.tex]
    evidence: [spec:DESIGN-1.5, cite:ETSI_GR_RIS003_v121]
    gates: []
  C-LINEAGE:
    text: "An earlier in-house simulator by the authors was used in [Mishra & Kherani WCL 2025, NCC 2025]; sremu is an independent new implementation. (The single transparency sentence; no comparison with that simulator is made anywhere in the paper.)"
    where: [sections/02_related_work.tex]
    evidence: [cite:Mishra2025WCL, cite:Mishra2025NCC, spec:DESIGN-D24]
    gates: []
  C-LINEAGE-DATA:
    text: "Data lineage (must-fix 11; allowed by D24, which forbids software lineage only): the laboratory map (sremu validation/ants_fig4b), the two laboratory cell-state phases (state library lab_binary_3p5ghz, provenance 'unpublished ANTS 2025 manuscript'), the frequency-offset sweep of V-CFO with its BPSK burst (the 29 offsets within +-1400 Hz are the grid of ANTS Fig. 2, which the sremu V-CFO-3 test docstring calls 'the ANTS Fig. 2 sweep regenerated'; the 2389-sample burst at 5880 S/s is the waveform of the BPSK pair of the ANTS CFO demonstration, its Sec. III-A, ported in sremu engine/streams.py; data/validation/cfo/PROVENANCE.md; disclosed in Sec. II and App. D since 2026-10-12) and the FM-band scenario of E-D (validation/fm/vfm.py, 'replaces ANTS Fig. 6') appeared earlier in the authors' unpublished ANTS 2025 conference submission, which drew a qualitative validation claim from the map (its abstract, Sec. III-C and conclusion: emulated and measured maps compared by directional trends, called a validation; read in research/scratch/ants/ants.txt); the pre-specified V-LAB comparison supersedes that validation (Sec. II says 'whose qualitative validation Section V-D supersedes'), and E-D replaces the earlier FM result. No citation: the submission is unpublished (rejected criticism R1-M3); a cover letter on the overlap is journal-stage."
    where: [sections/02_related_work.tex, sections/app_f_cases.tex, sections/app_d_vv.tex]
    evidence: [spec:DESIGN-10.9, spec:DESIGN-10.12, fig:F4, fig:F12]
    gates: []
  C-TRACE:
    text: "TRACE paragraph and Table I row (DESIGN 1.2 wording)."
    where: [sections/02_related_work.tex, sections/tables/table1_tools.tex]
    evidence: [cite:Kumar2026TRACE]
    gates: [H-4]
  C-ABS-TANG:
    text: "Tang et al. (MAJOR-9; author decision D-12 of 2026-10-11, reframed by mock-review must-fix 3 of 2026-10-12): the kernel reproduces the published model curves within the stated bound, an implementation check that also bounds the digitization error (K1 equals Tang's model for one point per cell); against the digitized chamber measurements (Fig. 10 of arXiv 2101.08607v2) of one 27 GHz surface in one uniformly coded state in specular geometries the emulator's received power is low by the stated mean (measured minus emulator; SD, RMSE; largest difference and per-geometry range in Appendix D), every measured point lies above it (checked by gen_results), and the published model is low by numTangPubMeasBiasDb (measured minus published, checked against vtang_summary.json): the emulator inherits Tang's published residual, so this is agreement of the model class with chamber data, not a test of reconfiguration, steering, near-field structure or timing; no switching, transient or timing behaviour is compared with measurements; abstract (2026-10-12): the emulator reproduces a published path-loss model, inheriting its numTangPubMeasBiasDb dB mean offset, and no switching or timing behaviour was compared with measurements; conclusion: chamber data test only the model class; caveats (Appendix D): digitized data, reported link budget and reflection amplitude, no stated measurement uncertainty, dependent points."
    where: [sections/abstract.tex, sections/05_verification_validation.tex, sections/app_d_vv.tex, sections/10_conclusion.tex, generated/tables/tableA_tang.tex]
    evidence: [test:V-TANG-1, fig:F3, cite:Tang2022mmWave, table:tab:tang]
    gates: []
  C-ABS-LAB:
    text: "Comparison (pre-specified and hash-locked before unblinding, not blind: the plan followed a descriptive inspection of the digitized map; must-fix 11) with a digitized 3.5 GHz laboratory measurement collected by the authors, analysed under a pre-specified plan hash-locked before unblinding (outcome phrase from the protocol's decision rules and power label: underpowered, null result). Not in the abstract (length); stated in the introduction and the conclusion."
    where: [sections/10_conclusion.tex]
    evidence: [test:V-LAB, fig:F4, spec:DESIGN-10.9]
    gates: []
    banned_word_uses:
      - {word: only, context: "from LOS-only"}
  C-ABS-PACED:
    text: "Abstract paced sentence (must-fix 1, 13; 2026-10-12): on the named platform (AWS c7i.8xlarge, Linux) the emulator alone ('headless', defined in place) sustains numPacedLinks transmitter-receiver links ('links' defined in place) at numPacedMSps MS/s, missing under 1e-3 of the 1 ms page deadlines (the Sustainable rule; B3, 1024 us pages, 3 repetitions); with 2 links (numBfourLinks, stated in the abstract so that the served misses are not read as the 8-link headless configuration) serving an external controller at 10-100 commands/s (B4, 1024 us pages) it applied at least numBfourExactOkMinPct % of the commands timed numBfourLeadOkMs ms ahead at their exact sample (pooled over the repetitions per rate and lead; one repetition at 4 ms had 99.66 %, App. E) (leads >= 4 ms: every timed command was exact or late, checked), but missed numBfourMissLowMinPct-numBfourMissMidMaxPct % of the 1 ms page deadlines, so no served repetition is Sustainable. No paced run exchanged IQ samples with external applications (Sec. VI limitations)."
    where: [sections/abstract.tex]
    evidence: [fig:F8, spec:DESIGN-12.1]
    gates: [H-5]
  C-ABS-EB:
    text: "E-B in the abstract (mock-review must-fix 2/10, 2026-10-12; number macros only, the phrase macro txtEBResult was removed): in lockstep runs with a modelled command latency (0.2 ms + J U; arc geometry modelled on the lab arrangement, SIM nominal geometry; AWS run, sweeps/results/E-B-arc), the IQ-level PER with the line of sight blocked follows the closed-form probability that a switch lands after the preamble (C-EB-CLOSED: every blocked cell with a zero closed form lost nothing, the excess is at most numEbCfMaxExcessPts points; checked by case_tables.eb2_compare); with the line of sight present, numEbLosLoExposedMinPct to numEbLosLoExposedMaxPct % of such (exposed) packets fail at the 15 dB sensitivity (PER over closed form, both alphabets, cells with a closed form of at least 0.1). The blocked case is the idealized regime in which the plate spares the RIS hops; the closed form itself is a property of the semantics."
    where: [sections/abstract.tex]
    evidence: [fig:F9, test:VA-5, test:E-B, pytest:tests/unit/test_eb_arc.py, pytest:tests/runtime/test_eb_arc_va5.py, table:tab:eb2grid]
    gates: []
  C-ABS-EA:
    text: "E-A in the abstract (mock-review must-fix 2/4/5, 2026-10-12; number macros only): on the offline vectorized evaluator of channel coefficients (experiments/ea.py, not the engine's run_batch; VA-1 checks it against IQ-level runs in one geometry, Section VII-B), position-driven binary control (exact optimum) loses half its benefit after numEaTauLambdaVMin to numEaTauLambdaVMax lambda/v of signaling delay over the numEaGeometries computed geometries (Table tab:eageo); lambda the wavelength, v the speed. The primary geometry's value (numEaTauOverLambdaV lambda/v; 1 GHz, 1 m/s: numEaTauHalf s) is stated in Section VII-B and the conclusion; it left the abstract for length on 2026-10-12 (paced sentence of must-fix 1)."
    where: [sections/abstract.tex]
    evidence: [fig:F10, test:VA-1, test:E-A, table:tab:eageo]
    gates: []
  C-NEXT-VALIDATION:
    text: "Next validation step (author decision 2026-10-11: deferred to arXiv v2): the open sub-6 GHz data set of Rossanese et al. 2024; it needs a new analysis plan locked before the emulator is run on the data because of the configuration-independent floor, the cells' seven phase states plus an absorbing state (WiNTECH 2022, Table 1) and the descriptive structure already seen (pre-specified, not blind)."
    where: [sections/09_future_work.tex]
    evidence: [cite:Rossanese2024OpenMeas, cite:Rossanese2022WiNTECH]
    gates: []
  C-ACK:
    text: "Acknowledgment: the AWS runs (marked AWS in the provenance table) used Amazon Web Services EC2 instances; laboratory, funding and the generative-AI disclosure are a planned-content stub for the authors (a final build refuses it)."
    where: [sections/back_matter.tex]
    evidence: [table:tab:provenance]
    gates: []

  # ================================================================ III Design
  C-ARCH:
    text: "The engine runs in the application's process (Device.inproc) or as a served process (Device.connect) behind one engine interface; a run with TX and RX in two OS processes gives bitwise the same RX samples as in one process."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:IO-02, test:IO-06, pytest:tests/io/test_io_api_device.py::test_api_recv_chunking_is_invisible, pytest:tests/io/test_io_wp8_serve_cli.py, fig:F1]
    gates: []
  C-PLANES:
    text: "A served engine uses ZMQ on three planes: framed IQ (TX ingress PUSH/PULL, per-RX egress), raw REQ/REP peers, JSON control on ROUTER (barriers to registered controllers on the same connection, never PUB) and telemetry on PUB; a session can start paused (default of the serving command)."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:IO-02, test:IO-03, test:RT-08, pytest:tests/io/test_io_wp8_lifecycle.py, pytest:tests/io/test_io_wp8_messages.py, pytest:tests/io/test_io_wp8_serve_cli.py, cite:ZeroMQ, fig:F1]
    gates: []
  C-RECORDING:
    text: "Each run directory holds the manifest (versions, git commit and dirty flag, platform, seeds and RNG scheme, input hashes and data classes, mode, backend, per-link interpolation/filter choices, counters), the resolved scenario, an append-only flushed event log, a metrics log per window and optional SigMF recordings with command annotations; replay and a static HTML report read run directories."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:IO-05, test:RT-16, pytest:tests/unit/test_manifest.py, pytest:tests/io/test_io_eventlog.py, pytest:tests/io/test_io_report.py, cite:SigMF]
    gates: []
  C-IMPL:
    text: "Implementation facts read by gen_results from the sremu checkout: Python >= the pyproject requires-python version; number of modules and thousands of lines in src/sremu; NumPy/SciPy, NumPy reference and numba backends, pyzmq, pydantic; Gymnasium and SigMF optional (DESIGN 2.4); runs on Windows (test record, laptop) and Linux (AWS runs)."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [spec:DESIGN-2.4, cite:ZeroMQ, cite:Towers2024Gymnasium, cite:SigMF, test:IO-02]
    gates: []
  C-TIMEBASE:
    text: "Exact rational rates and times; to_ticks = floor(t f + 1/2) (UHD rounding, error <= 1/(2f)); count = ceil(t1 f) - ceil(t0 f) for any mix of rates; API floats via their shortest decimal; wall time never enters data-plane arithmetic."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-01, test:RT-02, test:RT-15, cite:UHDManual]
    gates: []
  C-INVARIANCE:
    text: "Pages P_r = clamp(2^round(log2 f T_p), P_min, P_max) on an absolute grid, cut into segments; closed-form per-sample quantities, anchored recursions, fixed summation order: RX output bitwise invariant to client chunking, event/barrier/availability cuts, skipped pages and thread count (deterministic mode: the default, numba kernels compiled without Intel SVML; every emulator run quoted records deterministic and numba_disable_svml true; the coefficient-level cell-model sensitivity script uses the NumPy reference backend and records neither; defined in Appendix B); a page-target change is not bit-exact and stays within the RT-04 relative tolerance on the complex128 accumulators."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-03, test:RT-04, test:RT-10, fig:F2]
    gates: []
  C-LATE-CMD:
    text: "A late command (some switch sample below the frontier) is moved by apply_on_arrival to t' = max_{r,j}(frontier_r/f_r - tau_{r,j}) and re-mapped on every receiver; the record keeps requested/applied samples and lateness; reject returns LATE_COMMAND."
    where: [sections/03_design.tex]
    evidence: [test:RT-06, fig:F2]
    gates: []
  C-TIES:
    text: "Every command is kept; at equal time on one panel the later seq wins and the earlier is superseded; commands at different future times both apply."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-07]
    gates: []
  C-RECORDS:
    text: "One record per command with id, seq, source, op, requested/applied surface time, per-RX requested/applied samples, lateness, wall receipt/delivery times, status and a BLAKE2b hash of the applied configuration."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-06, test:IO-05, pytest:tests/io/test_io_eventlog.py, pytest:tests/unit/test_contracts.py::test_panel_config_hash_matches_independent_blake2b]
    gates: []
  C-COUNTERFACTUAL:
    text: "RIS absent/present is a separate counterfactual timeline with per-receiver switch samples, flagged in its records, that never changes element states."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [pytest:tests/runtime/test_rt04_and_events.py::test_set_enabled_counterfactual_removes_ris_paths_per_tile, pytest:tests/io/test_io_api_device.py::test_api_marker_and_set_enabled_records]
    gates: []
  C-TRANSITIONS:
    text: "Transition classes with step, linear or exponential profiles; h = h_old + sum_c g_c dh_c exactly by linearity, dh_c interpolated between snapshots (valid under mobility); re-command starts from the instantaneous Gamma; default duration reconfiguration_time_s; complex-linear path is ENG."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-12, cite:ETSI_GS_RIS008]
    gates: []
  C-BARRIERS:
    text: "Barriers at t_b = m T_c: every RX computed to to_ticks(t_b + L_min) first; observation from samples before to_ticks(t_b) (IQ-measured power, RIS state; optional positions, IQ window, oracle CSI flagged); actions at t_b + latency >= L_min, earlier raises LOOKAHEAD_VIOLATION; lateness 0 by construction; decision time does not change RX samples; in-process and remote controllers give identical RX."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-08, test:RT-17, fig:F2]
    gates: []
  C-LOCKSTEP:
    text: "Lockstep TX commitment by samples, end of burst or idle_until; RX pages wait for linked TX; stall report after the stall timeout; barrier runs deterministic; unregistered timed commands deterministic when on time, else nondeterministic_inputs."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-13, test:RT-08, test:RT-06]
    gates: []
  C-PACED:
    text: "Paced release R_j = t0 + k1/f + D_lag with hybrid sleep; late timed TX bursts dropped (time error), untimed gaps zero-filled (underflow), RX overflow drops pages, misses counted at the default slacks; paced mode is soft real time; lockstep + async is rejected."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-18, pytest:tests/io/test_io_wp8_backpressure.py, spec:DESIGN-4.10]
    gates: []
  C-BATCH:
    text: "The batch path (run_batch) evaluates combine(snapshot(t), cfg(t)) with the same model, commands, controllers and RNG keys, switches at surface time and reports tau_RIS->r; in a static scene with noise off, an in-process controller and no signaling delay its time-averaged power equals the IQ path's within the VA-4 relative tolerance, printed as numVaFourRelTol (1e-9, read by tools/vv_ids.py from sremu tests/runtime/test_va4_batch.py; VA-4 covers the static lab_like_A scene only). It holds each step at its start value (left-point rule, sremu engine/batch.py), so under mobility with a delayed controller it reads up to the stated 0.09 dB above the served IQ runs of VA-1 (va1.csv diff_iq_minus_run_batch_db, exact optimum at tau_SUI 0.1 s; checked by gen_results/case_tables) and fails VA-1's 0.02 dB limit; E-A therefore uses a separate vectorized midpoint evaluator (C-EA-EVAL)."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:VA-4, test:VA-1]
    gates: []
  C-REPLAY:
    text: "Replay re-injects recorded TX streams and commands at their applied times and reproduces RX bitwise, with each command at its recorded k_applied."
    where: [sections/03_design.tex]
    evidence: [test:RT-16]
    gates: []
  C-API:
    text: "UHD-shaped Python API (not UHD-compatible): TX/RX streams, UHD-style metadata with exact time specs, UHD stream modes, status codes (UHD RX and async codes plus sremu codes), timed RIS commands, set_command_time, one channel per stream; Table III generated from the code."
    where: [sections/03_design.tex, generated/tables/table3_api.tex, sections/app_b_interfaces.tex]
    evidence: [test:IO-06, pytest:tests/io/test_io_api_device.py::test_api_table_iii_rows, pytest:tests/io/test_io_api_device.py::test_api_command_time_and_time_forms, pytest:tests/io/test_io_api_device.py::test_api_streamargs_rates_are_exact, table:tab:api, cite:UHDManual]
    gates: []
  C-COMPAT:
    text: "Send_to_sim / Receive_from_sim give simple scripts a one-call interface; a BPSK transmitter and receiver script pair delivers every sample through them."
    where: [sections/03_design.tex, generated/tables/table3_api.tex, sections/app_b_interfaces.tex]
    evidence: [test:IO-07]
    gates: []
  C-FRAMES:
    text: "48-byte little-endian frame header (magic, version, flags, stream id, seq, first sample, count, nchan, dtype, wall clock), zero-copy payload; malformed frames dropped and counted; TX blocks at HWM (lockstep backpressure)."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:IO-01, test:IO-02, pytest:tests/io/test_io_wp8_backpressure.py]
    gates: []
  C-CONTROL:
    text: "JSON control envelope validated in order size (1 MiB), syntax, element count (65,536), schema; every refusal one code, counted; messages above the 16 MiB ZMQ MAXMSGSIZE close the connection without a reply (not counted); operations as listed; socket commands land at the exact sample with zero lateness in lockstep."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:IO-01, test:IO-03, test:IO-04, pytest:tests/io/test_io_wp8_messages.py]
    gates: []
  C-SECURITY:
    text: "No message field is a file path; loopback binding unless remote binding is allowed; no authentication; per-client command rate limit refused and counted."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:IO-04]
    gates: []
  C-RAW:
    text: "srsRAN-style raw REQ/REP mode (lockstep): request formats pinned from srsRAN 4G and GNU Radio sources, tested against stub peers; unmodified GNU Radio 3.10.9.2 runs against it (E-E); no srsRAN binary has been run."
    where: [sections/03_design.tex]
    evidence: [test:IO-08, cite:srsRANZMQ, pytest:tests/integration/test_gnuradio_raw.py]
    gates: []
  C-TABLES:
    text: "Response tables Gamma(s,f,theta_i,theta_s) on one angle grid: signed in-plane angles atan2(d.u, d.n) in the plane of the panel normal and its u axis (single plane of incidence; the off-plane component is projected out, or refused with out_of_plane='error'; obliquity and indicator use 3-D cosines), read at the link carrier (flat across the signal band, which may not exceed the validity bandwidth), with mandatory provenance fields (source kind, description, reference, reference plane, polarization, cell pattern flag, sigmas, raw hash, licence, creation record, transformations)."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:PH-31, pytest:tests/physics/test_ph31_validators.py]
    gates: []
  C-TABLE-CHECKS:
    text: "Validators: passivity (sigma-aware for measured/digitized), reciprocity (sigma-derived tolerance; recorded symmetrization), grid density, domain, bandwidth; complex-linear interpolation; incidence-only tables via the recorded half-difference extension; raw non-reciprocal tables rejected."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:PH-31, test:PH-28]
    gates: []
  C-TABLE-IMPORT:
    text: "CSV long form + provenance sidecar, MATLAB S-curve importer (simulated stand-in); built-ins: lab binary (assumed amplitudes), Tang RIS1/RIS2, ideal b-bit, antipodal, on-off, Abeywickrama; Monte Carlo sampling from stated sigma."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [test:PH-31, pytest:tests/physics/test_ph31_builtin_tables.py, pytest:tests/unit/test_states_cli.py, cite:Tang2022mmWave, cite:Mishra2025WCL, cite:Abeywickrama2020Practical]
    gates: []
  C-CAPS:
    text: "Panel capabilities with GS RIS 008 parameter names where they exist (n_elements, layout, control_granularity, states, gamma_source, operating_band_hz, max_bandwidth_hz, reconfiguration_time_s, max_command_rate_hz, static_power_w as metadata)."
    where: [sections/03_design.tex, sections/app_b_interfaces.tex]
    evidence: [pytest:tests/unit/test_contracts.py::test_ris_capabilities_defaults_and_dict, pytest:tests/io/test_io_wp8_messages.py::test_rt08_caps_roundtrip_with_nonfinite_floats, cite:ETSI_GS_RIS008, table:tab:standards]
    gates: []

  # ================================================================ IV Physical model
  C-STACK:
    text: "Analytic trajectories (static, waypoints, constant velocity, RWP 1-D/2-D, trace, external); snapshot in f64 gives non-RIS paths and B[r,s,n] per panel (rows = link x ground hop variant; separable form for angle-free tables); combine linear in Gamma; Friis-normalized coefficients; baseband conventions."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:ST-01, test:PH-08, test:PH-32, pytest:tests/physics/test_ph_geometry_trajectories.py, pytest:tests/physics/test_ph_propagation_contract.py::test_contract_combine_linear_in_gamma_and_disabled_panel, pytest:tests/physics/test_ph_propagation_contract.py::test_contract_angle_dependent_table_uses_b_form, cite:Bettstetter2003RWP]
    gates: []
  C-LOS:
    text: "LOS with scalar co-polar patterns (isotropic, cos^alpha with peak 2(alpha+1), tabulated) and explicit visibility (occluder 0, partition 10^(-L/20) [ENG], knife edge F(nu) coherent with RIS paths); occluders and partitions act on the LOS path and the ground and wall images (physics/propagation.py, ground.py, walls.py), never on a RIS hop; optional ground image, RIS hop image expansion, order-1 walls, additive diffuse."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-01, test:PH-27, test:PH-11, test:PH-10, test:PH-32, test:PH-08, test:ST-02]
    gates: []
  C-K1:
    text: "K1, the area-tied aperture kernel of Eq. (k1) (physical optics in the strict sense only with the Kirchhoff obliquity, Appendix C; mock review must-fix 9): pitch areas A_q summing to the cell pitch area, default obliquity sqrt(cos cos), Huygens j, front-side indicator (back side exactly zero)."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-02, test:PH-09, cite:Tang2022mmWave]
    gates: []
  C-K1-AREA:
    text: "Area tie makes fixed-aperture power independent of subdivision (a fixed per-cell gain would grow); j fixes the RIS-vs-LOS phase (a kernel without j fails image theory)."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-04, test:PH-05]
    gates: []
  C-K1-FORMS:
    text: "For point cells K1 equals Tang et al.'s cell model times j, ETSI GR RIS 003 clause 6.3.1.2 with G = 4 pi dx dy / lambda^2, and Ellingson's model with area-tied element gain, to double precision."
    where: [sections/04_physical_model.tex]
    evidence: [test:PH-02, cite:Tang2022mmWave, cite:ETSI_GR_RIS003_v121, cite:Ellingson2021PathLoss]
    gates: []
  C-K1-GUARDS:
    text: "Scenario check warns below three wavelengths and rejects below one; default obliquity energy-bounded; Kirchhoff option warns; only with the Kirchhoff obliquity is K1 the physical-optics integral, with the default it is an area-tied aperture kernel (both agree at specular); the continuous reference integral of F3(a) uses the default obliquity (figures/src/f03_aperture_tang.py)."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-23, pytest:tests/unit/test_scenario_guards.py, fig:F3]
    gates: []
  C-CELL-MODEL:
    text: "cell_model point / po_patch (sub-cells <= 0.2 lambda) / auto (point up to 0.5 lambda pitch); forced point on larger cells warns; includes_cell_pattern forces point without obliquity; models differ off specular (model-form uncertainty): for a far-field half-wavelength cell po_patch minus point is 0 dB at specular and the stated values at the stated retro angles (Richardson-converged; the default start fails for a lone cell at >= 45 deg retro). The lab pitch (42.8 mm) lies the stated margin below lambda/2 at 3.5 GHz, so auto resolves to point in E-B, the lab-like geometry of E-C and E-E (same pitch); the E-C synthetic panel has a pitch of exactly lambda/2 (experiments/ec.py), which auto also resolves to point; E-A sets point (lambda/4 cells), Tang and E-D resolve to it: every case study uses point, and V-LAB draws both models with equal prior weight; forcing po_patch on the laboratory tiles in E-B and the E-C lab-like geometry (sweeps/results/sensitivity_cellmodel, coefficient level; the E-C synthetic panel, E-A and E-E are not covered) lowers the RIS power by the stated range, moves the E-C losses and RX1's channel change at the E-B1 switch by at most the stated amounts, changes the E-B optima in at most the stated share of cells, and the point optimum loses at most the stated amount under po_patch; V-LAB paired M2 point-vs-patch differences as stated (sensitivity S-NF)."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-04, test:PH-26, test:V-LAB, cite:Tang2022mmWave]
    gates: []
  C-RICHARDSON:
    text: "Richardson check for po_patch: up to 8 representative links at Delta and Delta/2, at most 2 halvings to 0.05 dB, else failure; result in the manifest."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-04, pytest:tests/physics/test_ph04_refinement.py]
    gates: []
  C-NONIDEAL:
    text: "Ordered non-ideality pipeline: granularity expansion, quantizer argmax Re{Gamma-bar e^-j phi} with Gamma-bar the table at the panel reference geometry (unequal amplitudes), failure map (dead absorbing), table at cell angles, efficiency sqrt(eta) refused for measured/digitized unless overridden, coupling hook (a CouplingHook protocol whose only implementation is NoCoupling; separable tables only), transition. Mutual coupling is not modelled: a per-state table Gamma(S,F,T,T) holds coupling only for identical neighbours (locally periodic model, GR RIS 003 5.1.2). Closed-form checks incl. the binary decomposition Gamma = m +- d."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-13, test:PH-15, test:PH-25, test:PH-30, test:ST-03, cite:ETSI_GR_RIS003_v121]
    gates: []
  C-OPTIMUM:
    text: "Exact finite-alphabet optimum by a critical-angle sweep, O(S^2 N log(S^2 N)), equal to exhaustive search on every tested instance; not claimed as new."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-24, test:PH-29, cite:Zhang2022OptimalBinary, cite:Zhao2024OptimalDiscrete]
    gates: []
  C-DOPPLER:
    text: "Geometric Doppler: absolute snapshot grid; chord delay with exact carrier phase and complex-linear amplitude per non-RIS path; RIS rows split into tiles (reference delay + interpolated residual); switches never interpolated across."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-17, test:PH-18, test:PH-19]
    gates: []
  C-INTERP-BOUND:
    text: "One target eps_rel split in half between chord (T_curv formula) and tile residual; T_u0 = min(T_curv, cap), halvings up to M_MAX, cheapest feasible pair; scenario can lower T_u only."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-18, test:PH-19]
    gates: []
  C-VERIFY-INTERP:
    text: "verify_interp evaluates the exact midpoint snapshot every 64th interval, logs the max relative error per link, keeps the maximum in the manifest and flags runs above 2 eps_rel."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-18]
    gates: []
  C-FD:
    text: "Narrowband test pi B dtau <= 0.05 rad; otherwise grouped paths with one FD filter per group; Kaiser-sinc (beta 8) with 8/16/32 taps for B/f_s up to 0.2/0.6/0.8, 1024-phase polyphase table with linear interpolation, in-band error below -60 dB; wider bands rejected; integer delay when pi B/(2 f_s) <= 0.05."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-20, test:RT-11, cite:Laakso1996FracDelay]
    gates: []
  C-NOISE:
    text: "Thermal noise once per receiver, power k_B T0 F f_s (T0 = 290 K)."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:PH-21, test:G5]
    gates: []
  C-RNG:
    text: "Keyed variates: BLAKE2b-derived keys of (seed, purpose, name), Philox4x32-10 counter = absolute index; adding nodes or rechunking changes no other variate; backends produce identical integer streams; CFO as phase of the absolute index; Wiener PN; front end."
    where: [sections/04_physical_model.tex, sections/app_c_model.tex]
    evidence: [test:RT-14, test:RT-09, test:G4, pytest:tests/runtime/test_noise_oscillator.py, pytest:tests/runtime/test_noise_frontend.py, cite:Salmon2011Philox]
    gates: []

  # ================================================================ VIII Discussion
  C-STANDARDS:
    text: "Table VI maps GR RIS 002 (controller / micro-controller / control signalling), GR RIS 003 (5.1.2, 5.1.3, 6.3.1.2, 6.6, 6.8) and GS RIS 008 (4.1-4.8) to sremu elements; alignment, not conformance; EVM row used by the E-B study."
    where: [sections/08_discussion.tex, sections/tables/table6_standards.tex, sections/app_a_survey.tex]
    evidence: [table:tab:standards, cite:ETSI_GR_RIS002_v121, cite:ETSI_GR_RIS003_v121, cite:ETSI_GS_RIS008, test:PH-02, test:PH-05, test:PH-23, test:PH-26, test:PH-30, test:PH-31, test:RT-05, test:RT-06, test:RT-08, test:RT-12, test:RT-17, test:IO-03, test:G2, test:G3, fig:F9]
    gates: []
  C-CONTROLLER-API:
    text: "Controller protocol (name, period, min latency, observation spec, latency model; setup with capabilities and keyed generator; decide) runs in process or remotely with identical RX; built-ins as listed (incl. a reading of the WCL heuristic and a UCB1 bandit); keyed randomness. Gate H-3: the sentence makes a statement about the WCL letter (our reading of its heuristic)."
    where: [sections/08_discussion.tex, sections/app_b_interfaces.tex]
    evidence: [test:RT-08, test:VA-3, pytest:tests/unit/test_wp9_controllers.py, pytest:tests/unit/test_wp9_rng_reproducibility.py, cite:Mishra2025WCL, cite:Auer2002UCB]
    gates: [H-3]
  C-RISENV:
    text: "RisEnv: Gymnasium reset/step (subclass when installed, duck-typed otherwise), state or codebook actions after a latency, pilot-tone power reward, keyed samplers; batch path only in this release (IQ backends not connected)."
    where: [sections/08_discussion.tex, sections/app_b_interfaces.tex]
    evidence: [pytest:tests/unit/test_wp9_env.py, pytest:tests/unit/test_wp9_gym_quickstart.py, cite:Towers2024Gymnasium]
    gates: []
  C-REGRET:
    text: "RisEnv reports the exact finite-alphabet optimum from oracle CSI and the regret gap (zero for an optimal controller; can be negative with dead cells); the optimum bounds every built-in controller at every tested position."
    where: [sections/08_discussion.tex, sections/app_b_interfaces.tex]
    evidence: [test:VA-3, pytest:tests/unit/test_wp9_env.py::test_env_regret_is_zero_at_the_exhaustive_optimum_and_nonnegative, pytest:tests/unit/test_wp9_env.py::test_rollout_exact_optimum_has_zero_regret_and_ris_absent_drops_the_ris]
    gates: []
  C-LIMITS:
    text: "Limitations table from DESIGN 1.5 plus the batch-only RisEnv, occluders acting on the LOS (and ground/wall images) only, never on a RIS hop, single-plane angle tables, and no comparison of switching, transient or timing behaviour with measurements. Section VIII-C names four: paced mode is soft real time; no timing behaviour compared with measurements (E-B model-based), and Tang tests only the absolute level of one static state; mutual coupling not modelled (per-state tables hold it only for identical neighbours; the coupling hook ships only NoCoupling); occluders never attenuate a RIS hop, so the blocked E-B arc (plate crosses 152/240 Tx->cell segments) and the E-A corridor (partition crosses every AP->cell segment) are idealized; the lab-like E-B plate crosses no RIS hop (eb.blocker_crossings, not committed as a result) and is not called idealized."
    where: [sections/08_discussion.tex, sections/tables/table_limitations.tex, sections/app_c_model.tex]
    evidence: [spec:DESIGN-1.5, spec:DESIGN-5.2, table:tab:limitations, cite:Gurses2026ACHEM, cite:ETSI_GR_RIS003_v121]
    gates: []

  # ================================================================ Appendix
  C-ORACLES:
    text: "Four test tiers: analytic (PH/RT/IO), statistical (ST), MATLAB code-to-code (G1-G8, MATLAB not needed to run), validation/reproduction (V)."
    where: [sections/appendix.tex]
    evidence: [test:G1, test:G2, test:G3, test:G4, test:G5, test:G6, test:G7, test:G8, test:ST-01, test:ST-02, test:ST-03, spec:DESIGN-10.1]
    gates: []
  C-ORACLE-INDEPENDENCE:
    text: "Closed-form oracles live in a separate package that may not import physics/channel/impair (static and fresh-interpreter checks); the oracle families are as listed."
    where: [sections/appendix.tex]
    evidence: [pytest:tests/oracles/test_oracle_isolation.py, pytest:tests/unit/test_layering.py::test_oracle_isolation, pytest:tests/unit/test_layering.py::test_oracle_isolation_teeth, pytest:tests/oracles/test_oracles_pm_checks.py]
    gates: []
  C-TEETH:
    text: "Several guards have a negative-control twin that runs a deliberately wrong variant (kernel without j, too-short fractional-delay filter, replay with a dropped command) and must reject it. The teeth tests of other guards stay in the suite but are not featured in the paper."
    where: [sections/appendix.tex]
    evidence: [test:PH-05, test:PH-20, test:RT-16]
    gates: []
  C-REPRO:
    text: "Two repositories; the lock names the emulator commit that holds the results (no hash in the text, since the lock is re-pinned); tasks.py paper-junit records the test run with commit and dirty flag; build_paper.py --mode final refuses unless lock = installed commit, clean trees, green gates in a test record of the locked code (the tool requires junit commit == lock commit), current figures, pipeline macros and supported claims; code constants read from the locked code; manifests and bitwise replay; the results record their own commit, tree state and host (provenance table); neither repository is public yet (availability section)."
    where: [sections/appendix.tex]
    evidence: [spec:DESIGN-13.5, test:RT-16, table:tab:provenance]
    gates: []
  C-REPRO-RUNS:
    text: "Provenance of this version (must-fix 14), all from data (tools/vv_ids.py provenance_values from the provenance rows): the regeneration commit txtProvRegenCommit is the commit of the regeneration job's E-A row (clean), and the results at it (clean) are txtProvRegenResults, all but the benchmarks from one regeneration job on txtProvRegenHost (the host of the E-A row); the benchmarks (B2-F45, B3, B4, B4-classic at that commit) are separate jobs on dedicated hosts; the test record was made at txtProvTestCommit (junit sidecar, clean), and gen_results checks that the installed emulator checkout's src/sremu hash (experiments/common.py code_hashes) equals the src_sremu_tree_sha256 recorded by the regeneration results (sweeps/results/meta.json, E-F/latency, E-C), so the test record and the build use the emulator source of the regeneration commit (no claim about other files); the other results keep their commits, txtProvOtherCommits; V-LAB is not rerun (locked plan): one run at txtLabCodeCommit (clean) on predictions computed before the lock; the check at the test record's commit (sweeps/results/V-LAB-provenance/vlab_check_lock_1e1fcab.json, hash in meta.json, checked by tools/vv_ids.py against the junit commit) shows the V-LAB protocol and analysis files byte-identical to 7a63287 and the protocol digest equal to the lock; imported modules changed, so no claim that a rerun would reproduce it."
    where: [sections/appendix.tex]
    evidence: [table:tab:provenance, spec:DESIGN-10.9, spec:DESIGN-13.5]
    gates: []
  C-ID-TABLE:
    text: "Tables tab:ids-ph and tab:ids-rt (must-fix 12) list every verification identifier cited in the paper (PH, G, RT, IO, ST, VA, V-CFO) with property, oracle or reference, tolerance, the subsections of Sections III and IV whose statements the id checks (column Sec., mock review should-fix 5: those sections carry no inline ids except VA-1 and VA-4 in III-B; vv_ids.statement_sections, from the test evidence of the claim markers there plus ids cited in place) and the number of implementation tests in the test record; generated by tools/vv_ids.py from verification_ids.yaml, whose every number must appear in sremu docs/DESIGN.md (lines naming the id), tests/oracles/tables.py (ORACLE entries of that spec id) or the docstrings of the tests carrying the id; a cited id without a row, a row not passed in the record (except PH-12 experimental and V-CFO-4 study) and legacy/v1/v2 wording stop gen_results. VA identifiers are VA-1, VA-3, VA-4, VA-5 (no VA-2 in the specification)."
    where: [sections/appendix.tex, generated/tables/tableA_ids.tex]
    evidence: [table:tab:ids-ph, table:tab:ids-rt, table:tab:vv, test:VA-1, test:VA-3, test:VA-4, test:VA-5, spec:DESIGN-10.1, spec:DESIGN-4.11]
    gates: []
  C-PROVENANCE:
    text: "Data classes MEAS (measured data), DIG, REPORTED, ASSUMED, ENG (engineering choice), SIM-sremu, ANALYTIC, MATLAB on every input and figure; manifests list input hashes and classes; private data read from a private location with skipping tests; the laboratory measurement collected by the authors enters as a digitized map (DIG); process records (GitHub push log, data class PROVENANCE in its meta.json) carry no physical quantity; the provenance table (generated from the result files' records) lists commit, tree state, host and date of every result."
    where: [sections/appendix.tex, generated/tables/tableA_provenance.tex]
    evidence: [pytest:tests/unit/test_manifest.py, spec:DESIGN-3.6, spec:DESIGN-10.1, table:tab:provenance]
    gates: []

  # ================================================================ V Verification and validation
  C-VV-TABLE:
    text: "Table VII (generated from the test record of commit txtProvTestCommit, the junit sidecar's commit): every analytic identifier (PH, RT, IO) passes; ST, G and VA (VA-1, VA-3, VA-4, VA-5; there is no VA-2) tiers as counted; total passed and skipped tests; no skipped test carries a spec id; Appendix G lists every cited identifier (C-ID-TABLE)."
    where: [sections/05_verification_validation.tex, generated/tables/table4_vv.tex, sections/app_d_vv.tex]
    evidence: [table:tab:vv, test:PH-01, test:PH-02, test:PH-04, test:RT-01, test:RT-03, test:RT-05, test:RT-08, test:IO-01, test:IO-02, test:ST-01, test:ST-04, test:G1, spec:DESIGN-10.1]
    gates: []
  C-MATLAB:
    text: "Goldens G1-G8 from MATLAB R2026a scripts pass; this is code-to-code agreement, not validation; G2/G3 compare beam shapes after removing a documented constant and say nothing about absolute RIS power."
    where: [sections/05_verification_validation.tex, sections/app_d_vv.tex]
    evidence: [test:G1, test:G2, test:G3, test:G4, test:G5, test:G6, test:G7, test:G8, cite:ETSI_GR_RIS003_v121, spec:DESIGN-10.6]
    gates: []
  C-REFINE:
    text: "Fixed-aperture refinement (F3a): K1 with the default cell model stays within the stated deviation of the far-field closed form for every N; the patch model stays within the stated deviation of the continuous PO integral near field; the point model converges slowly (model-form difference)."
    where: [sections/05_verification_validation.tex, sections/app_d_vv.tex]
    evidence: [test:PH-04, test:PH-26, fig:F3]
    gates: []
  C-LAB-DATA:
    text: "The V-LAB data set is a laboratory measurement collected by the authors (3.5 GHz, 30 cells, binary RIS of six tiles whose two cell states have the reflection phases of the state library lab_binary_3p5ghz, numLabStateOnePhaseDeg / numLabStateTwoPhaseDeg = 49.64 / -153.77 deg, read from the locked code; magnitudes unknown), surviving as a colour map, digitized (DIG) with per-cell uncertainty; the geometry is known within ranges. App. D: measured by the authors with two Ettus B200 radios and vertical whips (VERT2450/VERT900; author-supplied facts in validation/ants_fig4b/PROTOCOL.md) in front of six binary tiles fabricated by the authors' group, whose RIS hardware includes the RF-switch unit cells of Khan et al. (INDICON 2025: 3.4 and 5.5 GHz cells); whether the tiles use the INDICON cell was not recorded (the V-LAB prior draws the INDICON cell or a square lambda/2 cell); map and phases appeared in the unpublished ANTS 2025 submission (its Fig. 4(b) and Sec. III-C, which also names the B200 USRP pair and the 'in-house-fabricated RIS'; research/scratch/ants/ants.txt), which drew a qualitative validation claim from the map (directional trends of emulated vs measured maps); the study digitized that colour map, the form in which the measurement was available; the pre-specified null result supersedes that claim. Who measured exactly and when, and why no per-position record survives, are open author inputs (gate H-1)."
    where: [sections/05_verification_validation.tex, sections/app_d_vv.tex, sections/appendix.tex]
    evidence: [test:V-LAB, fig:F4, spec:DESIGN-10.9, cite:Khan2025INDICON]
    gates: [H-1]
  C-LAB-PRESPEC:
    text: "The analysis plan (prior, models M0-M3, split, decision rules C1-C3) was fixed and hash-locked before any RIS model was fitted to the data, after a descriptive inspection of the digitized map that App. D discloses: cell grid, per-cell digitization uncertainty, the two cells pinned to the colour scale, ring means and SDs and a log-distance fit to all cells (n = 2.63, RMSE 2.78 dB; DESIGN.md 10.9 'already-computed descriptive statistics (disclosed)'). M0n of the plan has the form of that log-distance fit, so Sec. V-D says 'before fitting any RIS model to the data', not 'before any comparison of model and data'. The loader refuses data unless the hash matches. Facts from GitHub's server-side push log (sweeps/results/V-LAB-provenance, checked by gen_results): lock commit 101ee87 pushed 2026-10-11 00:22:55 UTC; two commits followed (content read from the sremu repository objects, not from GitHub's records): 2ef1401 adds a --columns option to validation/ants_fig4b/run.py (column names of the measured CSV), and 7a63287 (pushed 00:30:30 UTC) changes only the V-LAB smoke test; unblinded run started 00:30:44 UTC from a clean tree of 7a63287 (V-LAB record); result commit 2333b60 pushed 00:31:40 UTC. No public registry deposit before unblinding (stated); a retrospective deposit remains possible. Wording (must-fix 11): pre-specified and hash-locked before unblinding, not blind (the plan followed a descriptive inspection of the map); never pre-registered, never blinded."
    where: [sections/05_verification_validation.tex, sections/app_d_vv.tex]
    evidence: [test:V-LAB, spec:DESIGN-10.9]
    gates: []
  C-LAB-POWER:
    text: "Before unblinding, the decoy power analysis (500 decoys from M2) gave a C2 detection rate of 0, below the 0.5 threshold: labelled underpowered. The decoy counts of C1 and C3 are reported with it (protocol paper_wording)."
    where: [sections/05_verification_validation.tex, sections/app_d_vv.tex]
    evidence: [test:V-LAB, fig:F4]
    gates: []
  C-LAB-RESULT:
    text: "Unblinded outcome: C1, C2, C3 fail (also in every sensitivity run); median test RMSE of M0, M0n, M2 and bias as generated; Spearman rho with its 95 % (Fieller) interval; descriptive, outside the decision rules: the observed RMSE gain lies close to the median of the decoys drawn from M2 and above that of the decoys drawn from M0; null result, underpowered, not evidence for or against the model; one colour-scale-pinned cell is an outlier."
