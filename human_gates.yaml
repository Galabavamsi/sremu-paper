# human_gates.yaml -- human gates of DESIGN section 16 that block paper claims.
# Status changes ONLY when the named people have decided; record who and when.
# A claim in claims.yaml that lists an open gate is "pending": tolerated in draft builds,
# refused in final builds (tools/check_claims.py).
# Lead amendment A1: the generative-AI disclosure is NOT part of H-8 for now (deferred until
# the author consults Dr. Kherani; IEEE requires it in the acknowledgments at submission).
# Revision of 2026-10-11: the disclosure is a planned-content stub in the acknowledgment
# (sections/back_matter.tex), which a final build refuses until the authors write it; arXiv's
# moderation policy asks authors to report significant use of text-generating tools before
# posting.

