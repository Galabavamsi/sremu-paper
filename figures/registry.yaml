# figures/registry.yaml -- one entry per paper figure F1-F12 (DESIGN 13.4).
#
# Style for every figure: vector PDF; width 3.5 in (single column) or 7.16 in (double);
# fonts >= 8 pt, Type-42; Okabe-Ito palette; no titles inside; log axes for timing with an
# RTF = 1 reference line; every caption names its data classes.
#
# Fields
#   title        short description (caption source)
#   width        single | double
#   source       tikz (drawn in TeX, no data) | script (Python, writes data + PDF)
#   script       path of the figure script, relative to paper/ (null until written); for
#                tikz: the standalone .tex source, compiled by build_paper.py whenever LaTeX
#                runs (key = sha256 of the source and its `inputs`, e.g. the shared style)
#   sweep        sweep spec under paper/sweeps/ (WP11 data side) or null
#   inputs       data files whose sha256 enters the content key
#   evidence     spec ids the figure shows (tests, studies, benchmarks, experiments)
#   data_classes subset of {MEAS, DIG, REPORTED, ASSUMED, SIM-sremu, ANALYTIC, MATLAB}
#                (build_paper.py also knows SIM-legacy-v1/-v2; DESIGN D24: no paper figure
#                uses them); empty for diagrams
#   outputs      files the script writes (PDF under figures/out, data + meta under figures/data)
#   owner        work package that writes the script
#   status       pending | ready
#   notes        optional free text (e.g. which panels are still pending)
#
# build_paper.py computes content key = sha256(sremu commit, sweep spec, input hashes, script)
# and reruns an entry only when figures/data/<id>.meta.json records a different key.
# No figure is generated before GATE-PHY and GATE-RT are green (DESIGN 10.13).
#
# Script contract (run from paper/ with the sremu venv, final mode only):
#   python <script> --profile fast|full --figure <Fid> --content-key <key>
# It must write figures/out/<Fid>.pdf, figures/data/<Fid>.csv and figures/data/<Fid>.meta.json
# with at least {content_key, sremu_commit, data_classes, inputs: [{path, sha256, data_class}],
# assumptions: [...]}; the PDF caption in the .tex names the same data classes.

figures:
  F1:
    title: "Architecture: TX app, RX app and controller processes; engine; native/raw data planes vs control plane; recorder"
    width: single
    source: tikz
    script: figures/tikz/F1.tex
    sweep: null
    inputs: [figures/tikz/sremu-figstyle.tex]
    evidence: [IO-02, IO-03, RT-16]
    data_classes: []
    outputs: [figures/out/F1.pdf, figures/data/F1.meta.json]
    owner: WP12
    status: ready
